name: Deploy INEB KMS Project (Online DockerHub Flow)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 25 환경 설정
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25

      # 3. Spring Boot JAR 빌드
      - name: Build Backend Spring Boot
        run: |
          cd Homework4/backend/kms
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # 4. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 DockerHub Push
      # Backend 빌드 및 푸시 Step
      - name: Build & Push Backend Image
        run: |
          cd Homework4/backend/kms
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ineb-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ineb-backend:latest

      # Frontend 빌드 및 푸시 Step
      - name: Build & Push Frontend Image
        run: |
          cd Homework4/frontend/kms
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ineb-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ineb-frontend:latest

      # 6. EC2/개발 서버 접속 후 최신 이미지 배포
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 1. Docker 브릿지 네트워크 생성
            docker network create ineb-net || true
            
            # 2. DockerHub에서 최신 이미지 Pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/ineb-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/ineb-frontend:latest
            
            # 3. 기존 컨테이너 중지 및 삭제
            docker stop frontend backend || true
            docker rm frontend backend || true
            
            # 4. Backend 컨테이너 실행 (--env-file 환경변수 주입)
            docker run -d --name backend \
              --network ineb-net \
              --env-file /home/dguard/kms.env \
              ${{ secrets.DOCKER_USERNAME }}/ineb-backend:latest
              
            # 5. Frontend (Nginx) 컨테이너 실행
            docker run -d --name frontend \
              --network ineb-net \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/ineb-frontend:latest
              
            # 6. 미사용 구버전 이미지 정리
            docker image prune -f