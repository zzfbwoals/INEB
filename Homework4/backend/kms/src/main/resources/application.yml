spring:
  datasource:
    url: jdbc:postgresql://192.168.200.52:5432/INEB
    username: dguard
    # 운영 서버의 KMS_MASTER_PASSPHRASE(/home/dguard/kms.env)로 암호화한 DB 비밀번호 — 생성: "평문" | ./gradlew -q encryptSecret
    password: ENC(0lBSKT2c7E6v4t59uzFMVd11XlDSn4vdEU7HNvfFmXfdHqeE34OYQ7rWOwFxcB78JcoGZho=)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # 공지사항 첨부 업로드 — 파일당 20MB · 공지당 5개 (요청 상한 = 20MB×5 + 폼 필드). 초과 시 400 NOTICE_FILE_TOO_LARGE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 105MB

server:
  tomcat:
    # 상한 초과 업로드를 거부할 때 남은 본문을 읽어 버려야 브라우저가 커넥션 리셋 대신 400 응답을 받는다
    max-swallow-size: 110MB

kms:
  admin:
    # 최초 기동(admin_user 비어 있을 때)에만 사용하는 admin 초기 비밀번호 — DB 비밀번호와 같은 방식으로 암호화, 평문 금지
    init-password: ENC(Lk3r7Xpzov2ZB3MsCzvd17muDKk8CD3Os//tUmlk9Jz6o1J+uhJuIwFi8Cp7z9uRuDXZMoVH)
  # 키 생명주기 스케줄러 — 활성일·갱신 주기 자동 전이. integrity-check 는 전 버전 해시 배치 검증(위반 버전 60초 내 자동 정지, 2026-08-31 기본 on 으로 개정)
  scheduler:
    enabled: true
    interval-ms: 60000
    initial-delay-ms: 30000
    integrity-check: true
    # 사용자(app_user) 무결성 배치 — 해시 불일치인데 위반 표시가 없는 사용자만 USER_INTEGRITY_VIOLATION 기록(자동 조치 없음, SSE 로 목록 배지 갱신).
    # 2026-09-11: 실시간 감지는 아래 integrity.listen(트리거 알림)이 맡고 배치는 안전망. 원복해도 자동 복구 기록 없음 — 재해시로만 정상
    user-integrity-check: true
  # DB 직접 수정 실시간 감지 — 11개 테이블(설계 [표 6-1] 10개 + audit_log_shadow)의 INSERT/UPDATE/DELETE/TRUNCATE 트리거가 pg_notify 로 알리고
  # 앱이 LISTEN 으로 받아 처리: 앱 연결(application_name=kms-backend)의 변경은 무시, 그 밖의 세션 변경은 DB_DIRECT_CHANGE 기록 → SSE 로 화면 갱신,
  # 해시·체인 대상은 즉시 재검증(위반 기록). 트리거 해제는 60초 감시가 잡아 재설치. 연결 1개 상시 점유. false 면 배치(60초)만 동작
  integrity:
    listen: true
