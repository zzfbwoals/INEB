server {
    listen 80;

    root /usr/share/nginx/html;

    # 1. React 정적 파일 서빙 — 캐시 정책 (헤더가 없으면 브라우저가 휴리스틱 캐시해 배포 후 첫 진입에 구 번들이 실행됨)
    #    index.html: 항상 재검증 → 배포 직후에도 새 번들 해시를 받는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    #    /assets/*: 파일명에 콘텐츠 해시가 붙으므로 1년 불변 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 실시간 이벤트(SSE) — 버퍼링하면 이벤트가 브라우저에 늦게 도착하므로 끈다
    location /api/events {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 3. 백엔드 REST API Reverse Proxy
    #    공지사항 첨부 업로드(파일당 20MB × 5) — 기본값 1m 이면 Nginx 가 413 으로 끊어 백엔드 검증(400)에 닿지 못한다
    location /api {
        client_max_body_size 110m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Swagger UI 및 OpenAPI 문서 Reverse Proxy
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}