<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동작 테스트 — iNEB D'GuardKMS</title>
<link rel="stylesheet" href="assets/common.css">
<script src="assets/theme.js"></script>
<style>
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .hint{font-size:12px;color:var(--text-3)}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.test-card .body{padding:20px;display:flex;flex-direction:column;gap:14px}
.keyinfo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--text-2)}
.vtag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.parse{font-size:12px;color:var(--text-3);min-height:18px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.6;background:var(--blue-bg);color:var(--blue)}
.fmt{font-size:11.5px;color:var(--text-3);margin-top:4px}
.fmt code{font-family:inherit;color:var(--text-2);background:var(--raised);padding:0 5px;border-radius:4px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{padding:7px 14px;font-size:13px;font-weight:600;color:var(--text-3)}
.seg button.on{background:var(--blue-bg);color:var(--blue)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:1100px){.test-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<template id="page-body">
  <div class="page-h">
    <div><h2>동작 테스트</h2></div>
  </div>
  <div class="filters">
    <div class="field" style="min-width:320px">
      <label>대상 키 선택</label>
      <select class="input" id="testKeySel" onchange="testKeyChange()"></select>
    </div>
    <div class="field"><label>작업</label>
      <div class="seg"><button id="segEnc" onclick="setMode('enc')">암/복호화</button><button id="segSig" onclick="setMode('sig')">서명/검증</button></div></div>
    <div class="field"><label>버전</label>
      <select class="input" id="testVerSel"></select></div>
    <div class="keyinfo" id="keyInfo"></div>
  </div>
  <div class="test-grid">
    <div class="card test-card">
      <div class="card-h"><h3 id="encTitle">평문 암호화</h3><span class="hint" id="encHint"></span></div>
      <div class="body">
        <div class="field"><label id="encInLabel">평문 입력</label>
          <textarea class="input" id="encIn" placeholder="입력하세요"></textarea></div>
        <button class="btn btn-primary" style="align-self:flex-start" id="encBtn" onclick="runEncrypt()">암호화 실행</button>
        <div class="field"><label id="encOutLabel">암호문</label><div class="result-box" id="encOut">결과가 여기에 표시됩니다</div>
          <div class="fmt" id="encFmt"></div></div>
      </div>
    </div>
    <div class="card test-card">
      <div class="card-h"><h3 id="decTitle">암호문 복호화</h3><span class="hint" id="decHint"></span></div>
      <div class="body">
        <div class="field" id="decMsgField" style="display:none"><label>원문</label><textarea class="input" id="decMsg" placeholder="서명 대상 원문"></textarea></div>
        <div class="field"><label id="decInLabel">암호문</label>
          <textarea class="input" id="decIn" placeholder="version:iv:ciphertext 형식" oninput="parseCt()"></textarea>
          <div class="parse" id="decParse"></div></div>
        <button class="btn btn-primary" style="align-self:flex-start" id="decBtn" onclick="runDecrypt()">복호화 실행</button>
        <div class="field"><label id="decOutLabel">복호화 결과</label><div class="result-box" id="decOut">결과가 여기에 표시됩니다</div></div>
      </div>
    </div>
  </div>
</template>
<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell('test','키 관리 / <b>동작 테스트</b>');
const sel=document.getElementById('testKeySel');
sel.innerHTML=KEYS.map(k=>`<option value="${k.id}" ${k.status==='DESTROYED'?'disabled':''}>${k.name} · ${k.algo}${k.mode?'/'+k.mode:''} · ${PURPOSE[k.purpose]} · ${STATE_KO[k.status]} · v${k.currentVersion}${k.status==='DESTROYED'?' — 테스트 불가':''}</option>`).join('');
if(qs('id'))sel.value=qs('id');
const curKey=()=>KEYS.find(k=>k.id===Number(sel.value));
let mode='enc';
function setMode(m){mode=m;
  const k=curKey();
  document.getElementById('segEnc').classList.toggle('on',m==='enc');document.getElementById('segSig').classList.toggle('on',m==='sig');
  const sig=m==='sig';
  document.getElementById('encTitle').textContent=sig?'서명 생성':'평문 암호화';
  document.getElementById('decTitle').textContent=sig?'서명 검증':'암호문 복호화';
  document.getElementById('encBtn').textContent=sig?'서명 실행':'암호화 실행';
  document.getElementById('decBtn').textContent=sig?'검증 실행':'복호화 실행';
  document.getElementById('encInLabel').textContent=sig?'원문 입력':'평문 입력';
  document.getElementById('encOutLabel').textContent=sig?'서명값':'암호문';
  document.getElementById('decInLabel').textContent=sig?'서명값':'암호문';
  document.getElementById('decOutLabel').textContent=sig?'검증 결과':'복호화 결과';
  document.getElementById('decMsgField').style.display=sig?'':'none';
  document.getElementById('encFmt').innerHTML=sig?'형식: <code>{version}:{base64 signature}</code>':'형식: <code>{version}:{base64 iv}:{base64 ciphertext+tag}</code>';
  document.getElementById('decIn').value='';document.getElementById('decParse').textContent='';
  ['encOut','decOut'].forEach(id=>{const o=document.getElementById(id);o.className='result-box';o.textContent='결과가 여기에 표시됩니다';});
  refreshHints();
}
function refreshHints(){
  const k=curKey(),cv=k.versions.find(v=>v.v===k.currentVersion),curOk=cv&&cv.state==='ACTIVE';
  const decable=k.versions.filter(v=>v.state==='ACTIVE').map(v=>'v'+v.v);
  const opL=mode==='sig'?'서명':'암호화',opR=mode==='sig'?'검증':'복호화';
  document.getElementById('keyInfo').innerHTML=`${stateBadge(k.status)}`;
  document.getElementById('encBtn').disabled=!curOk;
}
function fillVersions(){
  const k=curKey(),vs=document.getElementById('testVerSel');
  vs.innerHTML=k.versions.slice().sort((a,b)=>b.v-a.v).map(v=>`<option value="${v.v}">v${v.v} · ${STATE_KO[v.state]}${v.v===k.currentVersion?' (최신)':''}</option>`).join('');
  vs.value=k.currentVersion;
}
function testKeyChange(){
  const k=curKey(),e=canEnc(k.purpose),s=canSign(k.purpose);
  document.getElementById('segEnc').disabled=!e;document.getElementById('segSig').disabled=!s;
  fillVersions();
  setMode(e?'enc':'sig');
  if(k.status!=='ACTIVE')toast('사용할 수 없는 상태의 키입니다');
}
function b64rand(n){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*64)];return s;}
function runEncrypt(){
  const k=curKey(),cv=k.versions.find(v=>v.v===k.currentVersion);
  if(!cv||cv.state!=='ACTIVE'){toast('최신 버전이 ACTIVE가 아닙니다');return;}
  if(Number(document.getElementById('testVerSel').value)!==k.currentVersion){toast('최신 버전이 아닙니다');return;}
  const out=document.getElementById('encOut'),sig=mode==='sig';
  const ct=sig?`${cv.v}:${b64rand(86)}==`:`${cv.v}:${b64rand(16)}:${b64rand(64)}==`;
  out.classList.add('ok');
  out.innerHTML=`${ct}`;
  document.getElementById('decIn').value=ct;if(sig)document.getElementById('decMsg').value=document.getElementById('encIn').value;parseCt();
  toast(`${sig?'서명':'암호화'}되었습니다`);
}
function parseCt(){
  const k=curKey(),raw=document.getElementById('decIn').value.trim(),p=document.getElementById('decParse'),sig=mode==='sig';
  if(!raw){p.textContent='';return null;}
  const parts=raw.split(':'),need=sig?2:3;
  if(parts.length!==need||!/^\d+$/.test(parts[0])){p.innerHTML='<b style="color:var(--red)">형식 오류</b> — 기대 형식 '+(sig?'version:signature':'version:iv:ciphertext')+' (400)';return {err:'형식 오류'};}
  const v=k.versions.find(x=>x.v===Number(parts[0]));
  if(!v){p.innerHTML=`<b style="color:var(--red)">v${parts[0]}</b> — 존재하지 않는 버전 (400)`;return {err:'존재하지 않는 버전'};}
  const ok=v.state==='ACTIVE';
  const old=ok&&v.v!==k.currentVersion;
  p.innerHTML=`→ <b>v${v.v}</b> ${stateBadge(v.state)} ${ok?(old?`<span style="color:var(--text-2)">${sig?'검증':'복호화'} 허용 (구 버전 — 감사로그 기록)</span>`:`${sig?'검증':'복호화'} 허용`):`<b style="color:var(--red)">차단 — ${STATE_KO[v.state]} 버전 (400)${v.integrity===false?' · 무결성 위반 자동 정지 — 상세에서 재활성화 가능':''}</b>`}`;
  return {v,ok,old};
}
function runDecrypt(){
  const r=parseCt(),out=document.getElementById('decOut'),sig=mode==='sig';
  if(!r){toast('입력이 필요합니다');return;}
  if(r.err){toast(r.err);return;}
  if(!r.ok){toast(`해당 버전은 ${sig?'검증':'복호화'}할 수 없습니다`);return;}
  out.classList.add('ok');
  out.innerHTML=sig
    ?`verified: true<br><span style="color:var(--text-3)">v${r.v.v} 공개키로 서명 검증 통과 · key_usage_log (version=${r.v.v}) · audit_log KEY_TEST_VERIFY</span>`
    :`plaintext: 고객 카드번호 테스트 데이터 4111-1111-1111-1111<br><span style="color:var(--text-3)">v${r.v.v}로 복호화 · 인증 태그 검증 통과 · key_usage_log (version=${r.v.v}) · audit_log KEY_TEST_DECRYPT</span>${r.old?'<br><span style="color:var(--text-2)">ⓘ 구 버전으로 처리됨 — 재암호화 대상 데이터입니다</span>':''}`;
  toast(sig?'서명이 검증되었습니다':'복호화되었습니다');
}
testKeyChange();
</script>
</body>
</html>
