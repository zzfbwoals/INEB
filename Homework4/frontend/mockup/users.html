<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사용자 관리 — iNEB D'GuardKMS</title>
<link rel="stylesheet" href="assets/common.css">
<script src="assets/theme.js"></script>
<style>
.mask{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.uavatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;margin-right:10px;vertical-align:middle}
.meta-box{padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px}
.meta-box .v{font-size:13.5px;font-weight:600}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<template id="page-body">
  <div class="page-h">
    <div><h2>사용자 관리</h2></div>
  </div>
  <div class="filters">
    <button class="btn btn-primary" style="padding:9px 11px;margin-left:auto;order:99" data-tip="등록" aria-label="등록" onclick="openUserForm()"><i data-lucide="plus" width="16" height="16" stroke-width="2.2"></i></button>
    <div class="search">
      <i data-lucide="search" width="14" height="14" stroke-width="2"></i>
      <input class="input" id="userSearch" placeholder="이름 검색" oninput="renderUsers()">
    </div>
    <input class="input mono" id="userExact" placeholder="연락처·이메일 정확검색" style="width:250px" onkeydown="if(event.key==='Enter')exactSearch()">
    <button class="btn btn-ghost" onclick="exactSearch()">검색</button>
    <select class="input" id="userStatus" onchange="renderUsers()">
      <option value="">상태 전체</option><option value="ACTIVE">활성</option><option value="SUSPENDED">정지</option>
    </select>
  </div>
  <div class="card">
    <div class="tbl-wrap"><table class="tbl-fixed">
      <thead><tr><th class="sortable" style="width:20%" onclick="sortUsers('name')">사용자</th><th style="width:17%">연락처</th><th style="width:24%">이메일</th><th style="width:10%">상태</th><th style="width:9%">무결성</th><th class="sortable" style="width:12%" onclick="sortUsers('joined')">가입일</th><th style="width:8%"></th></tr></thead>
      <tbody id="userTbody"></tbody>
    </table></div>
    <div class="pager" id="userPager"></div>
  </div>
</template>

<!-- 사용자 등록/수정 모달 -->
<div class="modal-bk" id="mdUser" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3 id="mdUserTitle">사용자 등록</h3><button class="x" onclick="closeModal('mdUser')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>이름 <em>*</em></label><input class="input" id="ufName" placeholder="홍길동"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field"><label>연락처 <em>*</em></label><input class="input mono" id="ufPhone" placeholder="010-0000-0000"></div>
        <div class="field"><label>상태</label><select class="input" id="ufStatus"><option value="ACTIVE">활성</option><option value="SUSPENDED">정지</option></select></div>
      </div>
      <div class="field"><label>이메일 <em>*</em></label><input class="input" id="ufEmail" placeholder="user@ineb.co.kr"></div>
      <div id="ufPwWrap" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field"><label id="ufPwLabel">초기 비밀번호 <em>*</em></label><input class="input" type="password" id="ufPw" placeholder="8자 이상, 특수문자 포함"></div>
        <div class="field"><label id="ufPw2Label">비밀번호 확인 <em>*</em></label><input class="input" type="password" id="ufPw2" placeholder="비밀번호 재입력"></div>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" id="ufResetBtn" onclick="togglePwReset()">비밀번호 재설정</button>
      <button class="btn btn-primary" onclick="saveUser()">저장</button>
    </div>
  </div>
</div>

<!-- 개인정보 원문 보기 모달 -->
<div class="modal-bk" id="mdPlain" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>개인정보 원문 조회</h3><button class="x" onclick="closeModal('mdPlain')">✕</button></div>
    <div class="modal-b">
      <!-- 사유만 입력 — 원문은 모달이 아니라 목록 행의 마스킹을 풀어 표시(아이콘 재클릭 시 다시 마스킹) -->
      <div class="field"><label>조회 사유 <em>*</em> <span class="badge b-bad" style="margin-left:6px">ADMIN 한정</span></label><input class="input" id="plainReason" placeholder="예: CS 본인확인 요청 처리"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-primary" id="plainBtn" onclick="viewPlain()">조회</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/lucide.min.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell('users');
let userPage=0,userSort={f:null,dir:1};
function goUserPage(p){userPage=p;renderUsers();}
function sortUsers(f){userSort.dir=userSort.f===f?-userSort.dir:1;userSort.f=f;markSort(f,userSort.dir);userPage=0;renderUsers();}
window.addEventListener('resize',()=>renderUsers());
function renderUsers(){
  const q=document.getElementById('userSearch').value.trim();
  const fs=document.getElementById('userStatus').value;
  let rows=USERS.filter(u=>(!q||u.name.includes(q))&&(!fs||u.status===fs));
  if(userSort.f){const f=userSort.f;rows=[...rows].sort((a,b)=>((''+(a[f]??''))>(''+(b[f]??''))?1:-1)*userSort.dir);}
  const size=autoPageSize(document.getElementById('userTbody').closest('.tbl-wrap'),58);
  const totalPages=Math.max(Math.ceil(rows.length/size),1);
  if(userPage>=totalPages)userPage=totalPages-1;
  const total=rows.length;rows=rows.slice(userPage*size,(userPage+1)*size);
  renderPager(document.getElementById('userPager'),total,userPage,totalPages,'goUserPage','명');
  document.getElementById('userTbody').innerHTML=rows.map(u=>`
    <tr>
      <td><span class="uavatar" style="background:var(--blue-bg);color:var(--blue)">${u.name[0]}</span><b>${u.name}</b></td>
      <td class="${revealed.has(u.id)?'mono':'mask'}">${revealed.has(u.id)?u.plainPhone:u.phone}</td>
      <td class="${revealed.has(u.id)?'mono':'mask'}">${revealed.has(u.id)?u.plainEmail:u.email}</td>
      <td>${u.status==='ACTIVE'?'<span class="badge b-active">활성</span>':'<span class="badge b-inactive">정지</span>'}</td>
      <td><span class="badge b-ok">정상</span></td>
      <td class="mono" style="color:var(--text-2)">${u.joined}</td>
      <td>
        <div style="display:flex;gap:4px;justify-content:flex-end">
          ${revealed.has(u.id)
            ?`<button class="icon-btn" data-tip="원문 숨기기" aria-label="원문 숨기기" onclick="togglePlain(${u.id})"><i data-lucide="eye" width="15" height="15" stroke-width="2"></i></button>`
            :`<button class="icon-btn" data-tip="원문 보기" aria-label="원문 보기" onclick="togglePlain(${u.id})"><i data-lucide="eye-off" width="15" height="15" stroke-width="2"></i></button>`}
          <button class="icon-btn" data-tip="수정" aria-label="수정" onclick="openUserForm(${u.id})"><i data-lucide="pencil" width="15" height="15" stroke-width="2"></i></button>
        </div>
      </td>
    </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:34px">검색 결과가 없습니다</td></tr>';
}
/* 정확검색 — 한 필드로 연락처·이메일 입력, '@' 포함이면 email_hash 아니면 phone_hash 정확검색(API phone/email 파라미터) */
function exactSearch(){
  const v=document.getElementById('userExact').value.trim();
  if(!v){toast('연락처 또는 이메일 전체를 입력해주세요');return;}
  const hit=v.includes('@')?USERS.some(u=>u.plainEmail===v.toLowerCase()):USERS.some(u=>u.plainPhone===v);
  toast(hit?'검색 결과 1건':'검색 결과가 없습니다');
}
let editUser=null,pwResetMode=false;
function openUserForm(id){
  editUser=id?USERS.find(u=>u.id===id):null;
  pwResetMode=false;
  document.getElementById('mdUserTitle').textContent=editUser?`사용자 수정`:'사용자 등록';
  document.getElementById('ufName').value=editUser?editUser.name:'';
  document.getElementById('ufPhone').value=editUser?editUser.plainPhone:'';
  document.getElementById('ufEmail').value=editUser?editUser.plainEmail:'';
  document.getElementById('ufStatus').value=editUser?editUser.status:'ACTIVE';
  document.getElementById('ufPw').value='';document.getElementById('ufPw2').value='';
  // 등록: 초기 비밀번호+확인 입력, 재설정 버튼 없음 / 수정: 재설정 버튼만, 누르면 입력 노출
  document.getElementById('ufPwWrap').style.display=editUser?'none':'grid';
  document.getElementById('ufResetBtn').style.display=editUser?'':'none';
  document.getElementById('ufResetBtn').textContent='비밀번호 재설정';
  document.getElementById('ufPwLabel').innerHTML=editUser?'새 비밀번호 <em>*</em>':'초기 비밀번호 <em>*</em>';
  document.getElementById('ufPw2Label').innerHTML=editUser?'새 비밀번호 확인 <em>*</em>':'비밀번호 확인 <em>*</em>';
  openModal('mdUser');
}
function togglePwReset(){
  pwResetMode=!pwResetMode;
  document.getElementById('ufPwWrap').style.display=pwResetMode?'grid':'none';
  document.getElementById('ufResetBtn').textContent=pwResetMode?'재설정 취소':'비밀번호 재설정';
  document.getElementById('ufPw').value='';document.getElementById('ufPw2').value='';
}
function saveUser(){
  const n=document.getElementById('ufName').value.trim();
  if(!n){toast('이름을 입력해주세요');return;}
  const needPw=!editUser||pwResetMode;
  if(needPw){
    const p=document.getElementById('ufPw').value,p2=document.getElementById('ufPw2').value;
    if(p.length<8){toast('비밀번호는 8자 이상이어야 합니다');return;}
    if(p!==p2){toast('비밀번호가 일치하지 않습니다');return;}
  }
  closeModal('mdUser');
  toast(editUser
    ?(pwResetMode?'비밀번호가 재설정되었습니다':'사용자 정보가 수정되었습니다')
    :'사용자가 등록되었습니다');
}
/* 원문이 풀린 사용자 id — 사유 입력(POST /api/users/{id}/plain, 감사 USER_PLAIN_VIEWED) 후 행 마스킹 해제, 재클릭 시 다시 마스킹 */
const revealed=new Set();
let plainTarget=null;
function togglePlain(id){
  if(revealed.has(id)){revealed.delete(id);renderUsers();return;}
  plainTarget=USERS.find(u=>u.id===id);
  document.getElementById('plainReason').value='';
  openModal('mdPlain');
}
function viewPlain(){
  const r=document.getElementById('plainReason').value.trim();
  if(!r){toast('조회 사유는 필수입니다');return;}
  revealed.add(plainTarget.id);
  closeModal('mdPlain');
  renderUsers();
  toast('원문이 조회되었습니다.');
}
renderUsers();
</script>
</body>
</html>
