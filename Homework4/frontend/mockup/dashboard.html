<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 — iNEB D'GuardKMS</title>
<link rel="stylesheet" href="assets/common.css">
<script src="assets/theme.js"></script>
<style>
/* 대시보드 전용 경고색 — 임박(주의)은 amber, 위반(위험)은 red 로 구분. common.css 토큰 승격 검토 */
:root{--amber:#E2A33B;--amber-bg:#3A2A10}
[data-theme="light"]{--amber:#B26E00;--amber-bg:#FFF1D6}

/* 한 화면 고정 — 콘텐츠를 100vh 그리드로 잡고 패널 보드가 남은 높이를 가짐. 카드 내부만 스크롤 */
.content{height:100vh;overflow:hidden;padding:18px 24px 16px;gap:12px;
  display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.page-h{align-items:center}
.card.fill{display:flex;flex-direction:column;min-height:0}
.card.fill .body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.card.fill .body::-webkit-scrollbar{width:6px}
.card.fill .body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}

/* 상단 상태줄: 체인 상태 + Quick actions */
.dash-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chain-band{display:flex;align-items:center;gap:12px;padding:5px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.chain-band .sep{width:1px;height:14px;background:var(--line-strong)}
.chain-band .icon-btn{margin:0 -6px}
.chain-band.bad{border-color:var(--red)}
.chain-ic{display:inline-flex;align-items:center;margin-right:-2px}
.chain-ic.ok{color:var(--green)}
.chain-ic.bad{color:var(--red)}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick .btn svg{flex:none}
.quick .qic{display:inline-flex}
.quick .qic svg{width:14px;height:14px}
.quick .btn-sm{gap:4px}

/* 드롭다운(.dd/.dd-menu)은 common.css 공용 — 등록 · 패널 편집 · 동작 테스트 버전 콤보박스가 함께 쓴다 */

/* 헤더 검색창 — 토스증권 상단 검색창처럼 "/" 키 배지 안내 */
.sbox{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 11px;min-width:224px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--raised);color:var(--text-3);font-size:12.5px;cursor:text;transition:border-color .15s,color .15s}
.sbox:hover{border-color:var(--text-3);color:var(--text-2)}
.sbox kbd,.srch kbd{font:inherit;font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);color:var(--text-2)}
.srch kbd{background:var(--raised)}

/* 통합 검색 모달 */
.modal.srch{max-width:660px;max-height:82vh}
.srch-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--text-3)}
.srch-in input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;font-weight:600;color:var(--text)}
.srch-in input::placeholder{color:var(--text-3);font-weight:500}
.sq-clear{display:inline-grid;place-items:center;color:var(--text-3);background:none;border:0;cursor:pointer;visibility:hidden}
.sq-clear:hover{color:var(--text)}
.srch-tabs{padding:6px 14px 0}
.srch-body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);flex:1;min-height:340px;max-height:58vh;overflow:hidden}
.srch-list,.srch-side{min-height:0}
.srch-list{overflow:auto;padding:8px 8px 8px 12px;border-right:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.srch-side{padding:18px 20px;overflow:auto;font-size:12.5px;color:var(--text-2)}
.sq-sec{font-size:11.5px;color:var(--text-3);font-weight:600;padding:10px 10px 6px}
.sq-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none;color:inherit}
.sq-row.on{background:var(--hover)}
.sq-row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--text-2);flex:none}
.sq-row .tx{flex:1;min-width:0}
.sq-row .tx>b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq-row .tx>span{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sq-row .rt{flex:none;font-size:11.5px;color:var(--text-3);text-align:right;white-space:nowrap}
.sq-row .ent{width:24px;height:24px;border-radius:7px;background:var(--raised);color:var(--text-2);display:none;place-items:center;flex:none}
.sq-row.on .ent{display:grid}
.sq-more{display:flex;align-items:center;gap:10px;margin:4px 10px 10px}
.sq-more i{flex:1;height:1px;background:var(--line)}
.sq-more a{font-size:12px;color:var(--text-2);cursor:pointer;transition:color .15s;white-space:nowrap}
.sq-more a:hover{color:var(--blue)}
.srch mark{background:none;color:var(--blue)}
.sq-empty{padding:44px 10px;text-align:center;color:var(--text-3);font-size:12.5px}
.sq-side-h{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.4}
.srch-side dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin-top:14px}
.srch-side dt{color:var(--text-3);white-space:nowrap}
.srch-side dd{color:var(--text);min-width:0;overflow-wrap:anywhere}
.srch-foot{display:flex;gap:18px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--text-2)}
.srch-foot span{display:inline-flex;align-items:center;gap:6px}

/* 실시간 표시 */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---- 패널 보드 (토스증권 '패널 편집' 참고) — 분할 트리(row/col 컨테이너 + panel 리프) ----
   처음엔 원래 그리드(grid4 · grid-mid · grid-bot)로 그려 행 높이·카드 너비를 측정 → 기본 트리의 비율(size). 그 뒤 .tree 로 전환.
   · 이동: 손잡이(⋮⋮)만 잡고 끌 수 있다. 다른 카드의 상하좌우 가장자리에 놓으면 그 사이에 끼어든다(겹침 없음). 놓일 자리는 파란 막대로 표시
   · 크기: 카드 사이 12px 간격이 분할선. 올리면 파란 선이 자라나고, 끌면 양쪽 카드가 상대 비율로 조절된다(다른 카드 불변)
   · X 닫기 / 패널 편집 메뉴로 표시·숨김 · 초기화. 트리는 localStorage(kms.dash.layout.v2)에 저장 */
.board{display:grid;grid-template-rows:auto minmax(0,1.15fr) minmax(0,1fr);gap:12px;min-height:0}
.board.tree{display:flex;flex-direction:column;position:relative;min-height:0}
.board.tree .node{display:flex;min-width:0;min-height:0}
.board.tree .node.row{flex-direction:row}
.board.tree .node.col{flex-direction:column}
.board.tree .card{min-width:0;min-height:0;margin:0;box-sizing:border-box}
.board.tree .card.fill{display:flex}
.board.tree .stat{overflow:hidden}
.board.tree .card.dragging{opacity:.35}
.split{flex:none;position:relative;z-index:2}
.split.v{width:12px;cursor:col-resize}
.split.h{height:12px;cursor:row-resize}
.split::after{content:'';position:absolute;background:var(--blue);border-radius:2px;transition:transform .18s ease}
.split.v::after{left:5px;top:0;width:2px;height:100%;transform:scaleY(0)}
.split.h::after{top:5px;left:0;height:2px;width:100%;transform:scaleX(0)}
.split:hover::after,.split.on::after{transform:scale(1)}
.drop-ind{position:absolute;background:var(--blue);border-radius:3px;pointer-events:none;display:none;z-index:5;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 28%,transparent)}
.ghost{position:fixed;pointer-events:none;opacity:.85;z-index:200;box-shadow:var(--modal-shadow)}
.grip{display:inline-flex;align-items:center;color:var(--text-3);flex:none;margin-right:-2px;opacity:.7;cursor:grab;touch-action:none}
.grip:hover{color:var(--text);opacity:1}
.grip:active{cursor:grabbing}
.card-h .grip{margin-left:-6px}
.board.tree .card-h{justify-content:flex-start}
.board.tree .card-h .hr{margin-left:auto;min-width:0;overflow:hidden;flex:none;max-width:70%}
.seg button{white-space:nowrap}
.board.tree .card-h h3{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board.tree .card-h .hint{white-space:nowrap}
.cx{margin-left:auto;flex:none}
.hr~.cx{margin-left:8px}
/* 요약 카드는 제목만 링크 — 카드 본문 클릭은 이동하지 않는다 */
.stat .tl{color:inherit;text-decoration:none}
.stat .tl:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}

/* 요약 카드 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{display:flex;flex-direction:column;color:inherit}
.stat .stat-b{flex:1;min-height:0;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.stat .num{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat .delta{font-size:11.5px;color:var(--text-3);line-height:1.5}
.stat .delta b{font-weight:700;color:var(--text-2)}
.stat.warn-ring{border-color:var(--red)}
.stat .row{display:flex;align-items:center;gap:12px;flex:1;min-height:0}
/* 도넛 크기는 JS(ResizeObserver)가 카드 본문 크기에 맞춰 px 로 지정 — 카드를 키우면 같이 커진다 */
.donut{flex:none;width:72px;height:72px}
/* 도넛 호버 — 가리킨 구간만 굵게, 나머지 흐리게, 같은 상태 칩 강조. 툴팁은 카드(overflow:hidden) 안에서 잘리지 않도록 body 에 붙는 .donut-tip(fixed, common.css)을 도넛 위 좌표에 띄운다 */
.donut-wrap{display:inline-flex;flex:none}
.donut circle{transition:opacity .15s,stroke-width .15s}
.donut.hv circle{opacity:.3}
.donut.hv circle.on{opacity:1;stroke-width:12}
.chips span{transition:color .15s}
.chips span.on{color:var(--text)}
.chips span.on b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:11.5px;color:var(--text-3)}
.chips span{display:inline-flex;align-items:center;gap:4px}
.chips i{width:7px;height:7px;border-radius:2px;display:inline-block}
.chips b{color:var(--text);font-variant-numeric:tabular-nums}
.iv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px 12px;font-size:11.5px;color:var(--text-3)}
.iv-grid b{color:var(--text-2);font-variant-numeric:tabular-nums}
.iv-grid b.bad{color:var(--red)}

/* 카드 공통 헤더 */
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.card-h h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h .hint{font-size:11.5px;color:var(--text-3);font-weight:500}
.card-h .cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--raised);color:var(--text-2);font-variant-numeric:tabular-nums}
.card-h .cnt.red{background:var(--red-bg);color:var(--red)}
/* "전체 보기 →"·체인 밴드 "감사 로그 →" 공용 — 호버 시 파란색으로 부드럽게 전환 */
.card-h a.more,.chain-band a.more{color:var(--text-3);text-decoration:none;transition:color .15s}
.card-h a.more{font-size:11.5px}
.card-h a.more:hover,.chain-band a.more:hover{color:var(--blue)}
.empty{padding:24px 16px;text-align:center;color:var(--text-3);font-size:12.5px}

/* 중간 행: 추이 차트 + 임박 키 */
.grid-mid{display:grid;grid-template-columns:1.65fr 1fr;gap:12px;min-height:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text-3);font-size:11px;font-weight:700;padding:4px 8px;cursor:pointer}
.seg button.on{background:var(--raised);color:var(--text)}
.chart-sum{display:flex;gap:16px;padding:8px 16px 0;font-size:11.5px;color:var(--text-3);flex:none}
.chart-sum b{color:var(--text);font-variant-numeric:tabular-nums}
.chart-wrap{flex:1;min-height:0;position:relative;padding:6px 12px 2px}
.chart-wrap svg{display:block;width:100%;height:100%}
.chart-tip{position:absolute;pointer-events:none;display:none;background:var(--raised);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 10px;font-size:11.5px;color:var(--text-2);box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.chart-tip b{display:block;color:var(--text);font-variant-numeric:tabular-nums;margin-bottom:3px}
.chart-tip span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chart-tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;gap:14px;padding:0 16px 8px;font-size:11.5px;color:var(--text-2);flex:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.exp-it{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.exp-it:last-child{border-bottom:none}
.exp-it:hover{background:var(--hover)}
.exp-it .kn{flex:1;min-width:0}
.exp-it .kn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-it .kn span{font-size:11px;color:var(--text-3)}
.exp-it .kind{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--raised);color:var(--text-3);flex:none}
.dday{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:7px;flex:none}
.dday.d-red{background:var(--red-bg);color:var(--red)}
.dday.d-amber{background:var(--amber-bg);color:var(--amber)}
.dday.d-blue{background:var(--blue-bg);color:var(--blue)}

/* 하단 행: 최근 활동 · 보안 신호 · 연산 실패 · 알고리즘 분포 */
.grid-bot{display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1fr;gap:12px;min-height:0}
.feed-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);font-size:12px}
.feed-it:last-child{border-bottom:none}
.feed-it.new{animation:pgin .4s;background:var(--blue-bg)}
.feed-it .who{font-weight:700;min-width:50px}
.feed-it .who.sys{color:var(--amber)}
.feed-it .what{min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.feed-it .what .mono{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-it .when{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.actchip{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:6px;flex:none;
  background:var(--raised);border:1px solid var(--line-strong);color:var(--text-2)}
.actchip.bad{background:var(--red-bg);border-color:transparent;color:var(--red)}
.sig-it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2)}
.sig-it:last-child{border-bottom:none}
.sig-it .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.sig-it .v.warn{color:var(--amber)}
.sig-it .v.bad{color:var(--red)}
.sig-it small{display:block;font-size:10.5px;color:var(--text-3);margin-top:1px}
.fail-it{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px;text-decoration:none;color:inherit}
.fail-it:last-child{border-bottom:none}
.fail-it:hover{background:var(--hover)}
.fail-it .kn{flex:1;min-width:0}
.fail-it .kn b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fail-it .kn span{font-size:11px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fail-it .when{font-size:11px;color:var(--text-3);white-space:nowrap}
.bars{padding:10px 16px;display:flex;flex-direction:column;gap:7px}
.bar-it{display:grid;grid-template-columns:46px 1fr 20px;align-items:center;gap:10px;font-size:11.5px}
.bar-it .nm{font-weight:700;color:var(--text-2)}
.bar-it .tr{height:7px;border-radius:4px;background:var(--raised);overflow:hidden}
.bar-it .fl{height:100%;border-radius:4px;background:var(--blue);opacity:.85}
.bar-it .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-3)}

/* 등록 모달 (keys.html · users.html · notices.html 과 동일 폼) */
.help{font-size:11.5px;color:var(--text-3);line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rot-row .input{width:110px;text-align:right}
.rot-row label.sw{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer}
.rot-row input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}

@media (max-width:1280px){.grid-bot{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1100px){.content{height:auto;overflow:visible;display:flex}.grid4{grid-template-columns:repeat(2,1fr)}.grid-mid{grid-template-columns:1fr}.chart-wrap{height:220px}.board.tree{height:900px}}
@media (max-width:720px){.grid-bot{grid-template-columns:1fr}}

/* 전체화면(관제) 모드 — 사이드바 숨기고 대시보드만 표시 */
html.dash-full .side{display:none}
html.dash-full .shell{grid-template-columns:1fr}
html.dash-full .content{padding:22px 32px 20px;gap:14px}
html.dash-full .page-h h2{display:none}
html.dash-full .stat .num{font-size:30px}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<template id="page-body">
  <div class="page-h">
    <div style="display:flex;align-items:center;gap:14px">
      <h2>대시보드</h2>
      <!-- SSE(GET /api/events) 수신 시 마지막 이벤트 시각 갱신. 연결 끊기면 점을 회색으로 -->
      <span class="live" id="liveTag"><i></i>실시간 · 마지막 이벤트 <span id="lastEvt"></span></span>
    </div>
    <div class="acts" style="display:flex;align-items:center;gap:8px">
      <!-- 통합 검색 — 클릭 또는 "/" 로 검색 모달 (토스증권 검색 참고) -->
      <button type="button" class="sbox" onclick="openSearch()" aria-label="검색">
        <i data-lucide="search" width="14" height="14" stroke-width="2"></i><kbd>/</kbd><span>를 눌러 검색하세요</span>
      </button>

<script>
renderShell('dashboard');
/* 기준 시각 — 더미 데이터의 최신 시각(2026-08-28)에 맞춤. 실제는 서버 KST now */
const NOW=new Date('2026-08-28T09:42:18+09:00');
const DAY=86400000;
const parseKst=s=>new Date(s.replace(' ','T')+'+09:00');
const hhmmss=d=>d.toTimeString().slice(0,8);
const fmtDay=d=>String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
function rel(s){
  const ms=NOW-parseKst(s);
  if(ms<60000)return '방금';
  const m=Math.floor(ms/60000);if(m<60)return m+'분 전';
  const h=Math.floor(m/60);if(h<24)return h+'시간 전';
  const d=Math.floor(h/24);if(d<30)return d+'일 전';
  return s.slice(0,10);
}
const keyById=id=>KEYS.find(k=>k.id===id);

/* ---------- 상단 ---------- */
document.querySelectorAll('.quick .qic').forEach(el=>{el.innerHTML=IC[el.dataset.ic];});
/* 드롭다운 열기/닫기(ddToggle/ddClose)는 shell.js 공용. 패널 편집 메뉴는 항목을 눌러도 닫히지 않는다(연속 토글) */

/* ---------- 통합 검색 (토스증권 검색 참고) ----------
   "/" 로 열기(입력 중이 아닐 때) · 탭(전체·키·사용자·공지사항·감사 로그)은 항상 표시, 검색어가 비면 목록·상세 모두 비움
   전체 탭은 항목별 5건 + 구분선 + 더 보기(→ 해당 탭) · 오른쪽은 선택 항목 상세 · ↑↓ 탐색, ↵ 상세 화면 이동, ESC 지우기→닫기
   API 전환 시: GET /api/search?q=&type= (키·사용자·공지·감사 통합, 사용자는 서버 복호화 부분검색) */
const SQ_CATS=[['keys','키'],['users','사용자'],['notices','공지사항'],['audits','감사 로그']];
let sqTab='all',sqRows=[],sqSel=0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s,q){s=String(s??'');if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
const hasQ=(q,...f)=>!q||f.some(v=>String(v??'').toLowerCase().includes(q));
const ICON=(n)=>`<span class="ic"><i data-lucide="${n}" width="14" height="14" stroke-width="2"></i></span>`;
function sqSearch(q){
  return {
    keys:KEYS.filter(k=>hasQ(q,k.name,k.algo,k.uid,k.desc,STATE_KO[k.status])).map(k=>({cat:'keys',d:k,href:`key-detail.html?id=${k.id}`,
      html:`${ICON('key-round')}<div class="tx"><b>${hl(k.name,q)}</b><span>${hl(k.algo,q)}${k.mode?' · '+k.mode:''} · v${k.currentVersion}</span></div><span class="rt">${stateDot(k.status)}</span>`})),
    users:USERS.filter(u=>hasQ(q,u.name,u.plainEmail,u.plainPhone,u.plainPhone.replace(/\D/g,''))).map(u=>({cat:'users',d:u,href:`users.html?id=${u.id}`,
      html:`${ICON('user')}<div class="tx"><b>${hl(u.name,q)}</b><span class="mono">${u.phone} · ${u.email}</span></div><span class="rt">${u.status==='ACTIVE'?'활성':'정지'}</span>`})),
    notices:NOTICES.filter(n=>hasQ(q,n.title,n.by)).map(n=>({cat:'notices',d:n,href:`notice-detail.html?id=${n.id}`,
      html:`${ICON('message-square')}<div class="tx"><b>${n.pinned?'<span class="pin-mark" style="margin-right:5px;vertical-align:-2px"><i data-lucide="pin" width="12" height="12"></i></span>':''}${hl(n.title,q)}</b><span>${hl(n.by,q)} · ${n.at} · 조회 ${n.views}</span></div><span class="rt">${n.files?'📎 '+n.files:''}</span>`})),
    audits:AUDITS.filter(a=>hasQ(q,a.action,a.actor,a.target,a.detail,a.keyId&&keyById(a.keyId)?.name)).map(a=>({cat:'audits',d:a,href:`audit.html?id=${a.id}`,
      html:`${ICON('shield-check')}<div class="tx"><b>${hl(a.action,q)}</b><span>${hl(a.actor,q)} · ${hl(a.target,q)}${a.keyId&&keyById(a.keyId)?' · '+hl(keyById(a.keyId).name,q):''}</span></div><span class="rt">${rel(a.at)}</span>`}))
  };
}
function openSearch(){const i=document.getElementById('sqInput');i.value='';sqTab='all';openModal('mdSearch');sqRender();setTimeout(()=>i.focus(),30);}
function sqClear(){const i=document.getElementById('sqInput');i.value='';sqTab='all';sqRender();i.focus();}
function sqRender(){
  const i=document.getElementById('sqInput'),q=i.value.trim().toLowerCase();
  document.getElementById('sqClear').style.visibility=q?'visible':'hidden';
  const tabs=document.getElementById('sqTabs');
  tabs.innerHTML=[['all','전체'],...SQ_CATS].map(([k,l])=>`<button type="button" class="tab ${sqTab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  const res=q?sqSearch(q):null;sqRows=[];let h='';
  const cats=q?(sqTab==='all'?SQ_CATS:SQ_CATS.filter(c=>c[0]===sqTab)):[];

/* ---------- 사용 추이 (더미 · API: /api/dashboard/usage-trend?days=&op=) ---------- */
const TREND=(function(){
  // 결정적 의사난수 — 새로고침마다 같은 그래프
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(NOW-i*DAY);const wk=d.getDay()===0||d.getDay()===6;
    const base=wk?6:18+Math.floor((29-i)/6);
    const enc=Math.round(base*(0.8+rnd()*0.6)), dec=Math.round(base*(0.5+rnd()*0.5));
    const sign=Math.round(base*0.3*(0.6+rnd()*0.8)), verify=Math.round(base*0.25*(0.6+rnd()*0.8));
    const fail=rnd()<0.35?Math.round(rnd()*3):0;
    days.push({d,ENC:{ok:enc+dec,fail:Math.min(fail,enc+dec)},SIGN:{ok:sign+verify,fail:rnd()<0.2?1:0}});
  }
  // 더미 usage_log 의 실제 실패 건을 해당 일자에 반영
  USAGE.filter(u=>u.result==='FAIL').forEach(u=>{const k=fmtDay(parseKst(u.at));const row=days.find(x=>fmtDay(x.d)===k);
    if(row){const g=(u.operation==='SIGN'||u.operation==='VERIFY')?'SIGN':'ENC';row[g].fail=Math.max(row[g].fail,1);}});
  return days;
})();
let trendOp='ALL',trendDays=30,trendRows=[],trendGeo=null;
function drawTrend(){
  trendRows=TREND.slice(-trendDays).map(r=>{
    const g=trendOp==='ALL'?[r.ENC,r.SIGN]:[r[trendOp]];
    return {d:r.d,ok:g.reduce((a,x)=>a+x.ok,0),fail:g.reduce((a,x)=>a+x.fail,0)};});
  const rows=trendRows;
  const tot=rows.reduce((a,r)=>a+r.ok+r.fail,0), fails=rows.reduce((a,r)=>a+r.fail,0);
  document.getElementById('chartSum').innerHTML=`<span>총 호출 <b>${tot.toLocaleString()}</b></span><span>실패 <b style="color:${fails?'var(--red)':'inherit'}">${fails}</b></span><span>실패율 <b>${tot?(fails/tot*100).toFixed(1):0}%</b></span><span>일평균 <b>${(tot/rows.length).toFixed(1)}</b></span>`;
  const wrap=document.getElementById('chartWrap'),svg=document.getElementById('trendChart');
  const W=Math.max(wrap.clientWidth-24,200),H=Math.max(wrap.clientHeight-8,80);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const pad={l:34,r:22,t:10,b:22};
  const max=Math.max(10,Math.ceil(Math.max(...rows.map(r=>r.ok+r.fail))/10)*10);
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const X=i=>pad.l+(rows.length===1?iw/2:i*iw/(rows.length-1)), Y=v=>pad.t+ih*(1-v/max);
  trendGeo={X,Y,pad,W,H};
  let s='';
  [max,max*2/3,max/3,0].forEach(v=>{const y=Y(v);
    s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" style="stroke:var(--line-strong)"/>`;
    s+=`<text x="${pad.l-8}" y="${y+4}" style="fill:var(--text-3)" font-size="10" text-anchor="end">${Math.round(v)}</text>`;});
  const okPts=rows.map((r,i)=>`${X(i)},${Y(r.ok)}`), failPts=rows.map((r,i)=>`${X(i)},${Y(r.fail)}`);
  s+=`<polygon points="${X(0)},${Y(0)} ${okPts.join(' ')} ${X(rows.length-1)},${Y(0)}" style="fill:var(--blue)" opacity=".10"/>`;
  s+=`<polyline points="${okPts.join(' ')}" fill="none" style="stroke:var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<polyline points="${failPts.join(' ')}" fill="none" style="stroke:var(--red)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  const step=trendDays===7?1:(iw<420?10:5);
  rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)
    s+=`<text x="${X(i)}" y="${H-6}" style="fill:var(--text-3)" font-size="10" text-anchor="middle">${fmtDay(r.d)}</text>`;});
  // 호버 가이드 (선·점) — mousemove 로 즉시 갱신
  s+=`<g id="hoverG" style="display:none"><line id="hvLine" y1="${pad.t}" y2="${H-pad.b}" style="stroke:var(--text-3)" stroke-dasharray="3 3"/>
      <circle id="hvOk" r="4" style="fill:var(--blue);stroke:var(--surface)" stroke-width="2"/>
      <circle id="hvFail" r="3.5" style="fill:var(--red);stroke:var(--surface)" stroke-width="2"/></g>`;
  svg.innerHTML=s;
}
function trendHover(e){
  if(!trendGeo||!trendRows.length)return;
  const wrap=document.getElementById('chartWrap'),svg=document.getElementById('trendChart');
  const rect=svg.getBoundingClientRect();
  const x=(e.clientX-rect.left)*trendGeo.W/rect.width;
  const {X,Y,pad,W}=trendGeo;
  if(x<pad.l-6||x>W-pad.r+6){trendLeave();return;}
  const iw=W-pad.l-pad.r;
  const i=Math.max(0,Math.min(trendRows.length-1,Math.round((x-pad.l)/iw*(trendRows.length-1))));
  const r=trendRows[i];
  document.getElementById('hoverG').style.display='';
  const hx=X(i);
  document.getElementById('hvLine').setAttribute('x1',hx);document.getElementById('hvLine').setAttribute('x2',hx);
  document.getElementById('hvOk').setAttribute('cx',hx);document.getElementById('hvOk').setAttribute('cy',Y(r.ok));
  document.getElementById('hvFail').setAttribute('cx',hx);document.getElementById('hvFail').setAttribute('cy',Y(r.fail));
  const tip=document.getElementById('chartTip');
  tip.style.display='block';
  tip.innerHTML=`<b>${r.d.getFullYear()}-${fmtDay(r.d).replace('/','-')} (${'일월화수목금토'[r.d.getDay()]})</b><span><i style="background:var(--blue)"></i>성공 ${r.ok}건</span><span><i style="background:var(--red)"></i>실패 ${r.fail}건</span>`;
  const px=hx*rect.width/trendGeo.W+(rect.left-wrap.getBoundingClientRect().left);
  const py=e.clientY-wrap.getBoundingClientRect().top;
  const flip=px+tip.offsetWidth+16>wrap.clientWidth;
  tip.style.left=(flip?px-tip.offsetWidth-12:px+12)+'px';
  tip.style.top=Math.max(4,Math.min(py-tip.offsetHeight/2,wrap.clientHeight-tip.offsetHeight-4))+'px';
}
function trendLeave(){
  const g=document.getElementById('hoverG');if(g)g.style.display='none';
  document.getElementById('chartTip').style.display='none';
}
document.getElementById('trendChart').addEventListener('mousemove',trendHover);
document.getElementById('trendChart').addEventListener('mouseleave',trendLeave);

/* ---------- 갱신 임박 · 예약 활성 ---------- */
(function expiring(){
  const items=[];
  KEYS.forEach(k=>{
    if(k.status==='ACTIVE'&&k.autoRotate&&k.nextRotationAt){
      const dd=Math.ceil((parseKst(k.nextRotationAt)-NOW)/DAY);
      // 도래분은 스케줄러(60초)가 자동 회전하므로 예정 목록에 남지 않는다 — 회전이 실패한 키는 보안 신호 카드(KEY_ROTATION_FAILED)로
      if(dd>0&&dd<=30)items.push({k,kind:'회전',dd,when:k.nextRotationAt.slice(0,10)+' 회전 예정'});
    }
    k.versions.filter(v=>v.state==='PRE_ACTIVE').forEach(v=>{
      const dd=Math.ceil((parseKst(v.activationDate)-NOW)/DAY);
      if(dd>0)items.push({k,kind:'활성',dd,when:`v${v.v} · ${v.activationDate.slice(0,10)} 활성 예정`});
    });
  });
  items.sort((a,b)=>a.dd-b.dd);
  document.getElementById('expCnt').textContent=items.length;
  const badge=i=>i.kind==='활성'?['d-blue','D-'+i.dd]:i.dd<=7?['d-red','D-'+i.dd]:['d-amber','D-'+i.dd];
  document.getElementById('expList').innerHTML=items.length?items.map(i=>{const [cls,txt]=badge(i);return `
    <a class="exp-it" href="key-detail.html?id=${i.k.id}">
      <span class="kind">${i.kind}</span>
      <div class="kn"><b>${i.k.name}</b><span class="mono">${i.k.algo} · ${i.when}</span></div>
      <span class="dday ${cls}">${txt}</span>
    </a>`;}).join('')
    :'<div class="empty">30일 이내 회전·활성 예정 키가 없습니다.</div>';
})();

/* ---------- 보안 신호 (더미 · API: /api/dashboard/summary.security, 24시간 창) ---------- */
(function signals(){
  const S=[
    {l:'로그인 실패',v:2,sub:'AUTH#admin 1 · AUTH#secops 1',lvl:'warn'},
    {l:'개인정보 원문 조회',v:1,sub:'USER_PLAIN_VIEWED · 사유 기록됨',lvl:''},
    {l:'키값 조회',v:0,sub:'KEY_MATERIAL_VIEWED',lvl:''},
    {l:'무결성 위반 감지',v:1,sub:'KEY_INTEGRITY_VIOLATION',lvl:'bad'},
  ];
  // 자동 갱신 실패 — 정상 운영에서는 스케줄러가 도래 즉시 회전하므로 발생하지 않는다. 남아 있으면 회전 예외(버전 상한 등)·스케줄러 중단 신호
  const rf=AUDITS.filter(a=>a.action==='KEY_ROTATION_FAILED'&&NOW-parseKst(a.at)<=DAY);
  S.push({l:'자동 갱신 실패',v:rf.length,sub:'KEY_ROTATION_FAILED'+(rf.length?' · '+[...new Set(rf.map(a=>keyById(a.keyId).name))].join(', '):''),lvl:'bad'});
  document.getElementById('sigList').innerHTML=S.map(s=>`
    <div class="sig-it"><div>${s.l}<small>${s.sub}</small></div><span class="v ${s.v?s.lvl:''}">${s.v}</span></div>`).join('');
})();

/* ---------- 연산 실패 (key_usage_log result=FAIL, 30일) ---------- */
(function fails(){
  const rows=USAGE.filter(u=>u.result==='FAIL'&&NOW-parseKst(u.at)<=30*DAY);
  document.getElementById('failCnt').textContent=rows.length;
  document.getElementById('failList').innerHTML=rows.length?rows.map(u=>{const k=keyById(u.keyId);return `
    <a class="fail-it" href="key-detail.html?id=${k.id}">
      <div class="kn"><b>${k.name} <span class="mono" style="color:var(--text-3);font-weight:500">v${u.version} · ${u.operation}</span></b><span title="${u.failReason}">${u.failReason}</span></div>
      <span class="when">${rel(u.at)}</span>
    </a>`;}).join('')
    :'<div class="empty">최근 30일 실패한 연산이 없습니다.</div>';
})();

/* ---------- 알고리즘 분포 (폐기 제외) ---------- */
(function algos(){
  const m={};KEYS.filter(k=>k.status!=='DESTROYED').forEach(k=>{m[k.algoName]=(m[k.algoName]||0)+1;});
  const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]);const max=rows.length?rows[0][1]:1;
  document.getElementById('algoBars').innerHTML=rows.map(([n,v])=>`
    <div class="bar-it"><span class="nm">${n}</span><div class="tr"><div class="fl" style="width:${v/max*100}%"></div></div><span class="v">${v}</span></div>`).join('');
})();

/* ---------- 패널 보드 — 토스증권 '패널 편집' 참고 (분할 트리) ----------
   트리: {type:'row'|'col', size, children:[…]} | {type:'panel', id, size}. size 는 형제 사이의 flex 비율.
   · 기본 트리 = 원래 그리드로 그린 행 높이·카드 너비 비율. 카드 렌더가 끝난 뒤 측정하므로 이 블록은 스크립트 끝에 둔다
   · 이동(손잡이만): 놓는 위치의 카드 가장자리에 따라 같은 방향 컨테이너면 형제로 끼어들고, 아니면 그 카드와 둘이서 새 컨테이너로 묶인다
   · 분할선 드래그: 양옆 두 형제의 size 합을 유지하며 나눈다 → 나머지 카드는 그대로
   · 저장: localStorage kms.dash.layout.v2 — React 전환 시 서버 저장(관리자별) 또는 그대로 브라우저 저장 선택 */
const LS_KEY='kms.dash.layout.v2';
const PANEL_GROUPS=[['요약',['keys','users','notices','integrity']],['분석',['trend','expiring','algos']],['활동',['feed','signals','fails']]];
const DEFAULT_ROW={keys:'A',users:'A',notices:'A',integrity:'A',trend:'B',expiring:'B',feed:'C',signals:'C',fails:'C',algos:'C'};
const board=document.getElementById('board');
const cardEl=Object.fromEntries([...board.querySelectorAll('.card[data-card]')].map(c=>[c.dataset.card,c]));
const MIN_W=160,MIN_H=80;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
let DEFAULT_TREE=null,tree=null;
function measureDefaults(){
  const b=board.getBoundingClientRect();
  DEFAULT_TREE={type:'col',size:1,children:[['A','.grid4'],['B','.grid-mid'],['C','.grid-bot']].map(([k,sel])=>{
    const g=board.querySelector(sel),gr=g.getBoundingClientRect();
    return {type:'row',k,size:gr.height/b.height,children:[...g.querySelectorAll('.card[data-card]')]
      .map(c=>({type:'panel',id:c.dataset.card,size:c.getBoundingClientRect().width/gr.width}))};})};
}
const cloneTree=t=>JSON.parse(JSON.stringify(t,(k,v)=>k==='el'?undefined:v));
function loadTree(){try{const v=JSON.parse(localStorage.getItem(LS_KEY));if(v&&v.v===2&&v.tree)return v.tree;}catch(e){}return null;}
function saveTree(){try{localStorage.setItem(LS_KEY,JSON.stringify({v:2,tree:cloneTree(tree)}));}catch(e){}}
function visibleIds(n=tree,out=[]){if(n.type==='panel')out.push(n.id);else n.children.forEach(c=>visibleIds(c,out));return out;}
function findParent(n,id){if(n.type==='panel')return null;for(const c of n.children){if(c.type==='panel'&&c.id===id)return n;const r=findParent(c,id);if(r)return r;}return null;}
/* 자식이 하나뿐인 컨테이너는 걷어내고, 같은 방향이 중첩되면 평탄화한다.
   형제 size 합은 항상 100 으로 맞춘다 — flex-grow 합이 1 미만이면 남는 공간을 그 비율만큼만 써서 행 오른쪽 끝이 비기 때문 */
function normalize(){
  const walk=n=>{
    if(n.type==='panel')return n;
    n.children=n.children.map(walk).filter(c=>c.type==='panel'||c.children.length);
    const flat=[];
    n.children.forEach(c=>{
      if(c.type===n.type){const s=c.children.reduce((a,x)=>a+x.size,0)||1;c.children.forEach(x=>flat.push({...x,size:c.size*x.size/s}));}
      else flat.push(c);});
    n.children=flat;
    if(n.children.length===1&&n!==tree)return {...n.children[0],size:n.size};
    const sum=n.children.reduce((a,x)=>a+x.size,0)||1;n.children.forEach(x=>{x.size=x.size/sum*100;});
    return n;};
  tree=walk(tree);
  if(tree.type!=='panel'&&tree.children.length===1&&tree.children[0].type!=='panel')tree={...tree.children[0],size:1};
}
function removeLeaf(id){const p=findParent(tree,id);if(!p)return;p.children=p.children.filter(c=>!(c.type==='panel'&&c.id===id));normalize();}
/* sizes = [leaf, target] 비율을 지정하면(다시 표시 시 기본 비율) 그대로 쓰고, 없으면 형제 평균 / 1:1 */
function insertLeaf(id,targetId,zone,sizes){
  const leaf={type:'panel',id,size:1};
  const p=findParent(tree,targetId);if(!p)return;
  const i=p.children.findIndex(c=>c.type==='panel'&&c.id===targetId),t=p.children[i];
  const horiz=zone==='left'||zone==='right',after=zone==='right'||zone==='bottom',want=horiz?'row':'col';
  if(p.type===want){leaf.size=sizes?t.size*sizes[0]/sizes[1]:p.children.reduce((a,x)=>a+x.size,0)/p.children.length;p.children.splice(after?i+1:i,0,leaf);}
  else{const ls=sizes?sizes[0]:1,ts=sizes?sizes[1]:1;p.children[i]={type:want,size:t.size,children:after?[{...t,size:ts},{...leaf,size:ls}]:[{...leaf,size:ls},{...t,size:ts}]};}
  normalize();
}
function render(){
  board.innerHTML='';
  const build=n=>{
    if(n.type==='panel'){const el=cardEl[n.id];el.style.flex=`${n.size} 1 0`;n.el=el;return el;}
    const el=document.createElement('div');el.className='node '+n.type;el.style.flex=`${n.size} 1 0`;n.el=el;
    n.children.forEach((c,i)=>{
      if(i){const sp=document.createElement('div');sp.className='split '+(n.type==='row'?'v':'h');bindSplit(sp,n,i);el.appendChild(sp);}
      el.appendChild(build(c));});
    return el;};
  const root=build(tree);root.style.flex='1 1 0';board.appendChild(root);
  const ind=document.createElement('div');ind.className='drop-ind';ind.id='dropInd';board.appendChild(ind);
  renderPanelMenu();
}
/* 분할선 — 양옆 형제(a,b)의 size 합을 유지하며 픽셀 비율로 재분배 */
function bindSplit(sp,n,i){
  sp.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;e.preventDefault();
    const a=n.children[i-1],b=n.children[i],horiz=n.type==='row';
    const ra=a.el.getBoundingClientRect(),rb=b.el.getBoundingClientRect();
    const aPx=horiz?ra.width:ra.height,bPx=horiz?rb.width:rb.height,total=aPx+bPx,sum=a.size+b.size;
    const min=Math.min(horiz?MIN_W:MIN_H,total/2),s0=horiz?e.clientX:e.clientY;
    sp.classList.add('on');document.body.style.cursor=horiz?'col-resize':'row-resize';
    const mv=ev=>{const na=clamp(aPx+((horiz?ev.clientX:ev.clientY)-s0),min,total-min);
      a.size=sum*na/total;b.size=sum-a.size;a.el.style.flexGrow=a.size;b.el.style.flexGrow=b.size;};
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
      sp.classList.remove('on');document.body.style.cursor='';saveTree();};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
}
/* 놓을 자리 판정 — 커서에 가장 가까운(자기 제외) 카드를 찾고, 그 카드 안에서 가장 가까운 가장자리를 zone 으로 */
function hitTest(x,y,selfId){
  const b=board.getBoundingClientRect();if(x<b.left||x>b.right||y<b.top||y>b.bottom)return null;
  let best=null,bd=Infinity;
  visibleIds().filter(i=>i!==selfId).forEach(i=>{const r=cardEl[i].getBoundingClientRect();
    const d=Math.hypot(Math.max(r.left-x,0,x-r.right),Math.max(r.top-y,0,y-r.bottom));
    if(d<bd){bd=d;best={id:i,r};}});
  if(!best)return null;
  const r=best.r,dl=(x-r.left)/r.width,dr=1-dl,dt=(y-r.top)/r.height,db=1-dt,m=Math.min(dl,dr,dt,db);
  return {id:best.id,r,zone:m===dl?'left':m===dr?'right':m===dt?'top':'bottom'};
}
function showInd(ind,t){
  if(!t){ind.style.display='none';return;}
  const b=board.getBoundingClientRect(),r=t.r,T=4;ind.style.display='block';
  if(t.zone==='left'||t.zone==='right'){ind.style.top=(r.top-b.top)+'px';ind.style.height=r.height+'px';ind.style.width=T+'px';
    ind.style.left=((t.zone==='left'?r.left-8:r.right+4)-b.left)+'px';}
  else{ind.style.left=(r.left-b.left)+'px';ind.style.width=r.width+'px';ind.style.height=T+'px';
    ind.style.top=((t.zone==='top'?r.top-8:r.bottom+4)-b.top)+'px';}
}
/* 손잡이 드래그 — 4px 이상 움직이면 고스트(복제본)가 커서를 따라가고 원본은 흐려진다. 놓으면 트리에서 빼서 목표 자리에 끼운다 */
function bindGrip(c){
  const id=c.dataset.card;
  c.querySelector('.grip').addEventListener('pointerdown',e=>{
    if(e.button!==0)return;e.preventDefault();
    const sx=e.clientX,sy=e.clientY,r0=c.getBoundingClientRect(),offX=sx-r0.left,offY=sy-r0.top;
    let ghost=null,target=null;const ind=document.getElementById('dropInd');
    const mv=ev=>{
      if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;
        ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r0.width+'px';ghost.style.height=r0.height+'px';
        document.body.appendChild(ghost);c.classList.add('dragging');document.body.style.cursor='grabbing';}
      ghost.style.left=(ev.clientX-offX)+'px';ghost.style.top=(ev.clientY-offY)+'px';
      target=hitTest(ev.clientX,ev.clientY,id);showInd(ind,target);};
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
      if(!ghost)return;ghost.remove();c.classList.remove('dragging');document.body.style.cursor='';ind.style.display='none';
      if(target){removeLeaf(id);insertLeaf(id,target.id,target.zone);render();saveTree();}};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
}
function hidePanel(id){removeLeaf(id);render();saveTree();}
/* 다시 표시 — 기본 배치에서 같은 행에 있던 이웃 중 아직 보이는 카드를 찾아 그 옆(원래 순서·기본 비율)에 끼운다.
   이웃이 모두 숨겨졌으면 원래 행 위치에 새 행으로 */
function showPanel(id){
  const k=DEFAULT_ROW[id],drow=DEFAULT_TREE.children.find(r=>r.k===k),ids=drow.children.map(c=>c.id),vis=new Set(visibleIds());
  const dsize=x=>drow.children.find(c=>c.id===x).size,i=ids.indexOf(id);
  let sib=null,zone='right';
  for(let j=i-1;j>=0&&!sib;j--)if(vis.has(ids[j]))sib=ids[j];
  if(!sib){zone='left';for(let j=i+1;j<ids.length&&!sib;j++)if(vis.has(ids[j]))sib=ids[j];}
  if(sib){insertLeaf(id,sib,zone,[dsize(id),dsize(sib)]);}
  else{
    if(tree.type!=='col')tree={type:'col',size:1,children:[{...tree,size:1}]};
    const nr={type:'row',k,size:drow.size,children:[{type:'panel',id,size:1}]};
    const order=n=>n.k||(visibleIds(n).map(x=>DEFAULT_ROW[x]).sort()[0]||'Z');
    const idx=tree.children.findIndex(n=>order(n)>k);tree.children.splice(idx<0?tree.children.length:idx,0,nr);
  }
  normalize();render();saveTree();
}
function resetLayout(){tree=cloneTree(DEFAULT_TREE);normalize();try{localStorage.removeItem(LS_KEY);}catch(e){}render();}
function renderPanelMenu(){
  const m=document.getElementById('panelMenu'),vis=new Set(visibleIds());
  m.innerHTML=PANEL_GROUPS.map(([g,ids])=>`<div class="mm-sec">${g}</div>`+ids.map(id=>
    `<button type="button" class="mm-it ${vis.has(id)?'on':''}" data-id="${id}"><span class="ck"><i data-lucide="check" width="14" height="14" stroke-width="2.6"></i></span>${cardEl[id].dataset.title}</button>`).join('')).join('')
    +`<div class="mm-div"></div><button type="button" class="mm-it" data-reset><span class="ck" style="opacity:1;color:var(--text-3)"><i data-lucide="rotate-ccw" width="14" height="14" stroke-width="2"></i></span>초기화</button>`;
  m.onclick=e=>{e.stopPropagation();const b=e.target.closest('.mm-it');if(!b)return;
    if(b.hasAttribute('data-reset')){resetLayout();toast('기본 배치로 되돌렸습니다.');return;}
    vis.has(b.dataset.id)?hidePanel(b.dataset.id):showPanel(b.dataset.id);};
}
function addChrome(c){
  const head=c.querySelector('.card-h');
  head.insertAdjacentHTML('afterbegin','<span class="grip" aria-label="이동"><i data-lucide="grip-vertical" width="14" height="14" stroke-width="2"></i></span>');
  const h3=head.querySelector('h3'),nx=h3&&h3.nextElementSibling;if(nx&&!nx.matches('a.more'))nx.classList.add('hr');   // "전체 보기 →" 는 제목 옆에 붙인다
  head.insertAdjacentHTML('beforeend','<button type="button" class="icon-btn sm cx" data-tip="닫기" aria-label="닫기"><i data-lucide="x" width="14" height="14" stroke-width="2"></i></button>');
  head.querySelector('.cx').addEventListener('click',e=>{e.stopPropagation();hidePanel(c.dataset.card);});
  bindGrip(c);
}
(function initBoard(){
  measureDefaults();
  Object.values(cardEl).forEach(addChrome);
  tree=loadTree()||cloneTree(DEFAULT_TREE);
  // 저장본에 알 수 없는 카드 id 가 있으면 제거
  const known=new Set(Object.keys(cardEl));
  (function prune(n){if(n.type!=='panel'){n.children=n.children.filter(c=>c.type!=='panel'||known.has(c.id));n.children.forEach(prune);}})(tree);
  normalize();
  board.classList.add('tree');
  render();
})();

/* ---------- Quick actions 등록 모달 (keys.html · users.html · notices.html 과 동일 로직) ---------- */
function openKeyNew(){
  ['nkName','nkDesc','nkAct'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nkAlgo').value='';document.getElementById('nkAutoRot').checked=true;document.getElementById('nkRot').value=ROT_DEFAULT;
  algoChange();rotToggle();openModal('mdKeyNew');
}
function fill(sel,arr,label){
  sel.innerHTML=arr.length?arr.map(v=>`<option value="${v}">${label?label(v):v}</option>`).join(''):'<option value="">—</option>';
  sel.disabled=!arr.length;
}
function algoChange(){
  const name=document.getElementById('nkAlgo').value,a=ALGOS[name];
  fill(document.getElementById('nkSize'),a?a.sizes:[],a&&a.sizeLabel?a.sizeLabel:null);
  fill(document.getElementById('nkMode'),a?a.modes:[]);
  const mode=document.getElementById('nkMode');
  if(a&&!a.modes.length)mode.innerHTML=`<option value="">해당 없음 (${a.hmac?'HMAC':'비대칭키'})</option>`;
  const p=document.getElementById('nkPurpose');
  if(a){p.value=a.purpose;[...p.options].forEach(o=>o.disabled=o.value!==a.purpose);
    document.getElementById('nkSize').value=String(a.sizes[a.sizes.length-1]);}
  else{[...p.options].forEach(o=>o.disabled=false);}
}
function rotToggle(){const on=document.getElementById('nkAutoRot').checked;document.getElementById('nkRot').disabled=!on;rotPreview();}
function rotPreview(){
  const on=document.getElementById('nkAutoRot').checked,d=Number(document.getElementById('nkRot').value);
  const h=document.getElementById('nkRotHelp');
  h.innerHTML=(on&&!(d>=ROT_MIN&&d<=ROT_MAX))?'<span style="color:var(--red)">1~730 범위여야 합니다</span>':'';
}
function createKey(){
  const n=document.getElementById('nkName').value.trim(),a=document.getElementById('nkAlgo').value;
  if(!n){toast('키명을 입력해주세요');return;}
  if(!a){toast('알고리즘을 선택해주세요');return;}
  const on=document.getElementById('nkAutoRot').checked,d=Number(document.getElementById('nkRot').value);
  if(on&&!(d>=ROT_MIN&&d<=ROT_MAX)){toast('갱신 주기는 1~730일이어야 합니다');return;}
  closeModal('mdKeyNew');
  toast('키가 생성되었습니다');
}
function openUserNew(){
  ['ufName','ufPhone','ufEmail','ufPw','ufPw2'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ufStatus').value='ACTIVE';
  openModal('mdUser');
}
function saveUser(){
  const n=document.getElementById('ufName').value.trim();
  if(!n){toast('이름을 입력해주세요');return;}
  const p=document.getElementById('ufPw').value,p2=document.getElementById('ufPw2').value;
  if(p.length<8){toast('비밀번호는 8자 이상이어야 합니다');return;}
  if(p!==p2){toast('비밀번호가 일치하지 않습니다');return;}
  closeModal('mdUser');
  toast('사용자가 등록되었습니다');
}
function createNotice(){
  if(!document.getElementById('ntTitle').value.trim()){toast('제목을 입력해주세요');return;}
  closeModal('mdNotice');
  document.getElementById('ntTitle').value='';document.getElementById('ntBody').value='';
  toast('공지사항이 등록되었습니다 · 첨부 암호화 저장');
}
