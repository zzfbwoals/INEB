<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — iNEB D'GuardKMS</title>
<link rel="stylesheet" href="assets/common.css">
<script src="assets/theme.js"></script>
<style>
#login-wrap{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(1100px 700px at 72% -10%,var(--login-glow1) 0%,transparent 55%),
             radial-gradient(900px 620px at 8% 110%,var(--login-glow2) 0%,transparent 52%),var(--bg)}
.keyglow{position:absolute;width:560px;height:560px;left:50%;top:50%;transform:translate(-50%,-54%);opacity:.1;filter:blur(2px);pointer-events:none}
.login-card{position:relative;width:min(420px,92vw);
  background:linear-gradient(160deg,var(--login-card-a),var(--login-card-b));
  border:1px solid var(--login-card-line);border-radius:20px;backdrop-filter:blur(18px);
  box-shadow:var(--modal-shadow);padding:42px 38px 34px}
.login-card .brand{display:flex;align-items:center;gap:11px;margin-bottom:34px}
.login-card h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.login-card .sub{color:var(--text-3);font-size:13px;margin-bottom:28px}
.login-card form{display:flex;flex-direction:column;gap:14px}
.lfield{position:relative}
.lfield svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.lfield .input{width:100%;padding:12px 13px 12px 40px}
.login-err{display:none;background:var(--red-bg);color:var(--red);
  font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:9px}
.login-err.show{display:block}
.login-btn{margin-top:8px;justify-content:center;padding:12px;font-size:14.5px;border-radius:10px}
.login-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12.5px;color:var(--text-3)}
.login-foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text-3);letter-spacing:.03em}
</style>
</head>
<body>
<div id="login-wrap">
  <svg class="keyglow" viewBox="0 0 100 140" fill="none">
    <circle cx="50" cy="38" r="32" fill="#3B9EFF"/><rect x="38" y="52" width="24" height="76" fill="#3B9EFF"/>
  </svg>
  <div class="login-card">
    <div class="brand">
      <svg width="86" height="26" viewBox="0 0 172 52" fill="none" aria-label="iNEB" style="color:var(--text)">
        <rect x="2" y="20" width="9" height="30" rx="1.5" fill="currentColor"/><circle cx="6.5" cy="10" r="6.5" fill="#7CC0FF"/>
        <rect x="3.5" y="12" width="6" height="16" rx="1" fill="#7CC0FF"/>
        <path d="M24 50V2h9l22 34V2h9v48h-9L33 16v34h-9z" fill="currentColor"/>
        <rect x="74" y="2" width="34" height="9" rx="1" fill="currentColor"/><rect x="74" y="21.5" width="34" height="9" rx="1" fill="currentColor"/>
        <rect x="74" y="41" width="34" height="9" rx="1" fill="currentColor"/>
        <path d="M118 2h26c9 0 15 5 15 12.5 0 5-2.6 8.6-6.6 10.5 5 1.8 8.6 6 8.6 12C161 45 154.6 50 145 50h-27V2zm9 19.5h16c4 0 6.5-2.2 6.5-5.5s-2.5-5.5-6.5-5.5h-16v11zm0 20h17c4.4 0 7-2.4 7-6s-2.6-6-7-6h-17v12z" fill="currentColor"/>
      </svg>
    </div>
    <h1>로그인</h1>
    <p class="sub">D'GuardKMS 통합키관리 어드민 콘솔</p>
    <div class="login-err" id="loginErr">아이디 또는 비밀번호가 일치하지 않습니다. (남은 시도 4회)</div>
    <form onsubmit="doLogin(event)">
      <div class="lfield">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <input class="input" id="loginId" placeholder="관리자 아이디" autocomplete="username" value="admin">
      </div>
      <div class="lfield">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input class="input" id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" value="Admin!@#$5">
      </div>
      <button class="btn btn-primary login-btn" type="submit">로그인</button>
    </form>
  </div>
  <div class="login-foot">CopyRight © 2008 INEB All Rights Reserved. · 192.168.200.52</div>
</div>
<script>
function doLogin(e){
  e.preventDefault();
  const id=document.getElementById('loginId').value.trim();
  const pw=document.getElementById('loginPw').value;
  if(id==='admin'&&pw==='Admin!@#$5'){location.href='dashboard.html';}
  else{document.getElementById('loginErr').classList.add('show');}
}
</script>
</body>
</html>
