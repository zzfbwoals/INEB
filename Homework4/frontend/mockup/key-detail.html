<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키 상세 — iNEB D'GuardKMS</title>
<link rel="stylesheet" href="assets/common.css">
<script src="assets/theme.js"></script>
<style>
.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .hint{font-size:12px;color:var(--text-3)}
.meta-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.meta-it{padding:14px 20px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.meta-it:nth-child(2n){border-right:none}
.meta-it:nth-last-child(-n+2){border-bottom:none}
.meta-it .k{font-size:11.5px;color:var(--text-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.meta-it .v{font-size:13.5px;font-weight:600}
.timeline{padding:6px 20px 18px}
/* 타임라인 카드 — 메타 카드 높이 초과분은 숨기고 하단 페이드 + 더보기(모달) */
.tl-card{position:relative;overflow:hidden}
.tl-more{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:center;padding:46px 0 14px;
  background:linear-gradient(to bottom,transparent,var(--surface) 72%)}
.tl-it{display:flex;gap:14px;position:relative;padding:12px 0}
.tl-it::before{content:'';position:absolute;left:6.5px;top:34px;bottom:-12px;width:2px;background:var(--line-strong)}
.tl-it:last-child::before{display:none}
.tl-dot{width:15px;height:15px;border-radius:50%;border:3px solid var(--surface);flex:none;margin-top:4px;box-shadow:0 0 0 1.5px var(--line-strong)}
.tl-body b{font-size:13.5px}
.tl-body .rs{font-size:12.5px;color:var(--text-2);margin-top:2px}
.tl-body .at{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:3px}
.usage-mini{display:flex;border-top:1px solid var(--line)}
.usage-mini>div{flex:1;padding:14px 20px;border-right:1px solid var(--line)}
.usage-mini>div:last-child{border-right:none}
.usage-mini .k{font-size:11.5px;color:var(--text-3);font-weight:700;margin-bottom:4px}
.usage-mini .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.vtag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--text-2);background:var(--raised);
  border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums;vertical-align:middle}
.vtag.cur{color:var(--green);border-color:transparent;background:var(--green-bg)}
.trg{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle}
.trg.sys{color:var(--blue);border-color:transparent;background:var(--blue-bg)}
.trg.bad{color:var(--red);border-color:transparent;background:var(--red-bg)}
.trg.ok{color:var(--green);border-color:transparent;background:var(--green-bg)}
tr.vcur td{background:var(--blue-bg)}
[data-theme="light"] tr.vcur td{background:#F2F8FF}
tr.rowlink.vcur:hover td{background:var(--hover)}
.help{font-size:11.5px;color:var(--text-3);line-height:1.5}
/* 위험 작업 모달 최근 사용 정보 — 박스 없이 한 줄 */
.deact-use{font-size:12.5px;color:var(--text-2);line-height:1.5}
.opt-row{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;cursor:pointer;background:var(--bg-deep)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt input{accent-color:var(--blue);margin-top:3px}
.opt b{font-size:13px;display:block}.opt span{font-size:12px;color:var(--text-3)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 12px;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--blue)}
.tab:hover{color:var(--text)}
.rot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rot-row .input{width:110px;text-align:right}
.rot-row label.sw{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer}
.rot-row input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}
.pubkey{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--text-3);word-break:break-all;line-height:1.5}
/* 구 ACTIVE 버전 역할 라벨 — 네이버식 모델(암호화는 최신만)을 화면 언어로 표기 */
.roletag{font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-bg);border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:middle}
/* 파기 복구 불가 확인 체크박스 */
.ack{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;line-height:1.5}
.ack input{accent-color:var(--red);margin-top:2px;width:14px;height:14px;flex:none}
@media (max-width:1100px){.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<template id="page-body">
  <div class="page-h">
    <div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <a class="btn btn-ghost btn-sm" href="keys.html">← 목록</a>
        <h2 id="kdName">-</h2>
        <span id="kdBadge"></span>
        <span class="vtag cur" id="kdCur"></span>
      </div>
      <div class="desc mono" style="margin-top:8px;display:flex;align-items:center;gap:8px">
        <span id="kdUid"></span>
        <button class="copy-btn" onclick="copyEl('kdUid')" title="UID 복사"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복사</button>
      </div>
    </div>
    <div class="acts" id="kdActs"></div>
  </div>
  <div class="detail-grid">
    <div class="card" id="kdMetaCard">
      <div class="card-h"><h3>키 메타정보</h3><button class="btn btn-ghost btn-sm" id="btnEdit" onclick="openEdit()">수정</button></div>
      <div class="meta-grid" id="kdMeta"></div>
      <div class="usage-mini" id="kdUsage"></div>
    </div>
    <div class="card tl-card" id="kdTlCard">
      <div class="card-h"><h3>상태 변경 타임라인</h3></div>
      <div class="timeline" id="kdTimeline"></div>
      <div class="tl-more" id="tlMore"><button class="btn btn-ghost btn-sm" onclick="openTimeline()">더보기</button></div>
    </div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab on" id="tabVer" onclick="showTab('ver')">버전 목록</button>
      <button class="tab" id="tabAud" onclick="showTab('aud')">사용 이력</button>
    </div>
    <div id="paneVer" class="tbl-wrap"><table>
      <thead><tr><th>버전</th><th>상태</th><th>활성일</th><th>마지막 사용</th><th>사용 횟수</th><th id="thCap">암호화 / 복호화</th><th>무결성</th><th></th></tr></thead>
      <tbody id="kdVersions"></tbody>
    </table></div>
    <div id="paneAud" class="tbl-wrap" style="display:none"><table>
      <thead><tr><th>일시</th><th>연산</th><th>버전</th><th>결과</th><th>실패 사유 / 비고</th></tr></thead>
      <tbody id="kdAudit"></tbody>
    </table></div>
  </div>
</template>

<!-- 전체 타임라인 — 페이지 대신 모달 본문이 스크롤 -->
<div class="modal-bk" id="mdTimeline" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>상태 변경 타임라인</h3><button class="x" onclick="closeModal('mdTimeline')">✕</button></div>
    <div class="modal-b" style="max-height:62vh;overflow-y:auto">
      <div class="timeline" id="mdTlBody" style="padding:0"></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal('mdTimeline')">닫기</button></div>
  </div>
</div>
<!-- 활성화 -->
<div class="modal-bk" id="mdActivate" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>키 활성화</h3><button class="x" onclick="closeModal('mdActivate')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>사유 <em>*</em></label><textarea class="input txt" id="actReason" style="min-height:70px" placeholder="예: 연동 시스템 배포 완료로 예정보다 앞당겨 활성"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdActivate')">취소</button>
      <button class="btn btn-primary" onclick="doAction('ACTIVATE')">지금 활성화</button></div>
  </div>
</div>
<!-- 재활성화 (무결성 위반 정지 버전 전용) -->
<div class="modal-bk" id="mdReactivate" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3 id="reactTitle">키 재활성화</h3><button class="x" onclick="closeModal('mdReactivate')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>사유 <em>*</em></label><textarea class="input txt" id="reactReason" style="min-height:70px" placeholder="예: DB 점검 중 활성일 컬럼 수동 수정으로 인한 오탐 확인, 재암호화 위해 복구"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdReactivate')">취소</button>
      <button class="btn btn-primary" onclick="doAction('REACTIVATE')">재활성화</button></div>
  </div>
</div>
<!-- 정지 -->
<div class="modal-bk" id="mdDeactivate" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3 id="deactTitle">키 정지</h3><button class="x" onclick="closeModal('mdDeactivate')">✕</button></div>
    <div class="modal-b">
      <div class="deact-use" id="deactInfo"></div>
      <div class="field"><label>사유 <em>*</em></label><textarea class="input txt" id="deactReason" style="min-height:70px" placeholder="예: 해당 버전 암호문 전량 재암호화 완료"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdDeactivate')">취소</button>
      <button class="btn btn-danger" onclick="doAction('DEACTIVATE')">정지</button></div>
  </div>
</div>
<!-- 회전 -->
<div class="modal-bk" id="mdRotate" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>키 갱신</h3><button class="x" onclick="closeModal('mdRotate')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>새 버전 활성일</label><input class="input mono" type="datetime-local" id="rotAct"></div>
      <div class="field"><label>사유 <em>*</em></label><textarea class="input txt" id="rotReason" style="min-height:70px" placeholder="예: 수동 갱신 — 연동 시스템 교체"></textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdRotate')">취소</button>
      <button class="btn btn-primary" id="rotBtn" onclick="doAction('ROTATE')">갱신</button></div>
  </div>
</div>
<!-- 폐기 -->
<div class="modal-bk" id="mdDestroy" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>키 삭제</h3><button class="x" onclick="closeModal('mdDestroy')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>삭제 대상</label><div class="opt-row" id="desOpts"></div></div>
      <div class="field"><label>확인을 위해 키명 입력 <em>*</em></label><input class="input mono" id="desConfirm" placeholder="키명을 정확히 입력"></div>
      <div class="field"><label>사유 <em>*</em></label><textarea class="input txt" id="desReason" style="min-height:70px" placeholder="예: 해당 버전 암호문 전량 파기 확인"></textarea></div>
      <label class="ack"><input type="checkbox" id="desAck" onchange="document.getElementById('desBtn').disabled=!this.checked">키 재료가 영구 삭제되며 복구할 수 없음을 확인합니다</label>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdDestroy')">취소</button>
      <button class="btn btn-danger" id="desBtn" disabled onclick="doAction('DESTROY')">삭제</button></div>
  </div>
</div>
<!-- 메타 수정 -->
<div class="modal-bk" id="mdEdit" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3>키 메타정보 수정</h3><button class="x" onclick="closeModal('mdEdit')">✕</button></div>
    <div class="modal-b">
      <div class="field"><label>키명</label><input class="input" id="edName"></div>
      <div class="field"><label>설명</label><input class="input" id="edDesc"></div>
      <div class="field"><label>갱신 주기 (회전)</label>
        <div class="rot-row"><label class="sw"><input type="checkbox" id="edAutoRot" onchange="document.getElementById('edRot').disabled=!this.checked">자동 갱신</label>
          <input class="input mono" type="number" id="edRot" min="1" max="730"> <span style="font-size:13px;color:var(--text-2)">일</span></div>
        </div>
      <div id="edDates"></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal('mdEdit')">취소</button><button class="btn btn-primary" onclick="saveEdit()">저장</button></div>
  </div>
</div>

<!-- 키값 조회 모달 (사유 필수 · 감사로그 기록) -->
<div class="modal-bk" id="mdReveal" onclick="bkClose(event,this)">
  <div class="modal">
    <div class="modal-h"><h3 id="mdRevealTitle">키값 조회</h3><button class="x" onclick="closeModal('mdReveal')">✕</button></div>
    <div class="modal-b">
      <div class="field" id="rvReasonWrap"><label>조회 사유 <em>*</em></label>
        <textarea class="input" id="rvReason" placeholder="예: 연동 시스템 키 배포를 위한 값 확인" style="min-height:70px"></textarea></div>
      <div class="field" id="rvResult" style="display:none"><label id="rvLabel">키 재료 (Base64)</label>
        <div class="result-box ok" id="rvValue" style="word-break:break-all;user-select:none"></div>
        <div style="margin-top:8px"><button class="copy-btn" onclick="copyEl('rvValue')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복사</button></div></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal('mdReveal')">닫기</button>
      <button class="btn btn-primary" id="rvBtn" onclick="doReveal()">조회</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell('keys');
const key=KEYS.find(k=>k.id===Number(qs('id')))||KEYS[0];
const fmt=s=>s?s.slice(0,16):'—';
const latest=()=>key.versions.reduce((m,v)=>v.v>m.v?v:m,key.versions[0]);
const cur=()=>key.versions.find(v=>v.v===key.currentVersion);
const preV=()=>key.versions.find(v=>v.state==='PRE_ACTIVE');
const actives=()=>key.versions.filter(v=>v.state==='ACTIVE');
const enc=canEnc(key.purpose),sig=canSign(key.purpose);
const capLabel=(enc&&sig)?'암호화·서명 / 복호화·검증':enc?'암호화 / 복호화':'서명 / 검증';
function deriveStatus(){
  if(actives().length)return 'ACTIVE';
  if(preV())return 'PRE_ACTIVE';
  if(key.versions.every(v=>v.state==='DESTROYED'))return 'DESTROYED';
  return 'DEACTIVATED';
}
function capOf(v){ /* 암호화(서명)는 current_version만, 복호화(검증)는 ACTIVE 전부 — 구 버전은 역할 라벨로 명시 */
  if(v.state!=='ACTIVE')return '✗ / ✗';
  if(v.v===key.currentVersion)return '✓ / ✓';
  return `✗ / ✓<span class="roletag">${enc?(sig?'복호화·검증':'복호화'):'검증'} 전용</span>`;
}
/* 비대칭키 공개키 목업 값 — 복사·.pem 다운로드용 */
const PEM_TEXT='-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2v7…(생략)…IDAQAB\n-----END PUBLIC KEY-----';
function downloadPem(){downloadText(`${key.name}_v${key.currentVersion}.pem`,PEM_TEXT,'application/x-pem-file');}
function render(){
  key.status=deriveStatus();
  document.getElementById('kdName').textContent=key.name;
  document.getElementById('kdUid').textContent=key.uid;
  document.getElementById('kdBadge').innerHTML=stateBadge(key.status);
  document.getElementById('kdCur').textContent='v'+key.currentVersion;
  const s=key.status,pv=preV(),acts=[],cv=cur();
  if(s!=='DESTROYED')acts.push(`<a class="btn btn-ghost" href="test.html?id=${key.id}">동작 테스트</a>`);
  if(pv)acts.push(`<button class="btn btn-primary" onclick="openActivate()">활성화</button>`);
  if(actives().length)acts.push(`<button class="btn btn-ghost" onclick="openDeactivate(null)">정지</button>`);
  if(s==='ACTIVE'||s==='DEACTIVATED')acts.push(`<button class="btn btn-primary" onclick="openRotate()">갱신</button>`);
  if(s!=='DESTROYED'&&key.versions.some(v=>v.state==='DEACTIVATED'||v.state==='PRE_ACTIVE'))acts.push(`<button class="btn btn-danger" onclick="openDestroy()">삭제</button>`);
  document.getElementById('kdActs').innerHTML=acts.join('');
  document.getElementById('btnEdit').style.display=s==='DESTROYED'?'none':'';
  const a=ALGOS[key.algoName];
  document.getElementById('kdMeta').innerHTML=`
    <div class="meta-it"><div class="k">알고리즘 / 사이즈</div><div class="v">${key.algoName} · ${a&&a.sizeLabel?a.sizeLabel(key.size):key.size+' bit'}</div></div>
    <div class="meta-it"><div class="k">모드 / 용도</div><div class="v">${key.mode||(a&&a.hmac?'HMAC':'—')} · ${PURPOSE[key.purpose]}</div></div>
    <div class="meta-it"><div class="k">버전</div><div class="v">v${key.currentVersion}</div></div>
    <div class="meta-it"><div class="k">갱신 주기 / 다음 갱신</div><div class="v mono">${key.autoRotate?`${key.rotationPeriodDays}일 · ${fmt(key.nextRotationAt)}${key.dday<=0&&s==='ACTIVE'?' <b style="color:var(--red)">(지연)</b>':''}`:'수동 갱신'}</div></div>
    <div class="meta-it"><div class="k">활성일 (v${key.currentVersion})</div><div class="v mono">${fmt(cv.activationDate)}${cv.state==='PRE_ACTIVE'?' <b style="color:var(--blue)">(예정)</b>':''}</div></div>
    <div class="meta-it"><div class="k">설명</div><div class="v" style="font-weight:500">${key.desc||'—'}</div></div>
    <div class="meta-it"><div class="k">생성일</div><div class="v mono">${key.created}</div></div>
    <div class="meta-it"><div class="k">integrity_hash</div><div class="v mono" style="font-size:11.5px;color:var(--text-3)">a3f9c2…e81d <b style="color:${key.integrity?'var(--green)':'var(--red)'}">${key.integrity?'✓':'✕'}</b></div></div>
    ${a&&a.asym?`<div class="meta-it" style="grid-column:1/-1"><div class="k" style="display:flex;align-items:center;gap:8px">공개키 (v${key.currentVersion}, PEM)
      <button class="copy-btn" onclick="copyText(PEM_TEXT)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복사</button>
      <button class="copy-btn" onclick="downloadPem()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 20h16"/></svg>.pem</button></div>
    <div class="pubkey">${PEM_TEXT.replaceAll('\n','<br>')}</div></div>`:''}`;
  const lastUse=key.versions.map(v=>v.lastUsedAt).filter(Boolean).sort().pop()||null;
  document.getElementById('kdUsage').innerHTML=`
    <div><div class="k">마지막 사용</div><div class="v" id="kdLastUse" style="font-size:15px" title="${lastUse||''}">${relTime(lastUse)}</div></div>
    <div><div class="k">테스트 호출</div><div class="v">142</div></div>
    <div><div class="k">${enc?'암호화':'서명'}</div><div class="v">89</div></div>
    <div><div class="k">${enc?'복호화':'검증'}</div><div class="v">53</div></div>
    <div><div class="k">구 버전 ${enc?'복호화':'검증'}</div><div class="v" style="color:var(--text-2)">7</div></div>
    <div><div class="k">실패·차단</div><div class="v" style="color:var(--red)">2</div></div>`;
  document.getElementById('thCap').textContent=capLabel;
  const lt=latest();
  document.getElementById('kdVersions').innerHTML=[...key.versions].sort((a,b)=>b.v-a.v).map(v=>{
    const isCur=v.v===key.currentVersion,isLatest=v.v===lt.v;
    let act='';
    if(v.state==='PRE_ACTIVE')act=`<button class="btn btn-ghost btn-sm" onclick="openActivate()">활성화</button> <button class="btn btn-ghost btn-sm" onclick="openDestroy(${v.v})">삭제</button>`;
    else if(v.state==='ACTIVE')act=isLatest?`<span class="help" title="최신 버전은 단독 정지 불가 — 키 정지 또는 갱신 후 정지">최신 버전</span>`:`<button class="btn btn-ghost btn-sm" onclick="openDeactivate(${v.v})" title="정지 시 이 버전의 복호화·검증이 차단됩니다">정지</button>`;
    else if(v.state==='DEACTIVATED')act=(v.deactivationTrigger==='INTEGRITY'?`<button class="btn btn-primary btn-sm" onclick="openReactivate(${v.v})">재활성화</button> `:'')+`<button class="btn btn-ghost btn-sm" onclick="openDestroy(${v.v})">삭제</button>`;
    return `<tr class="${isCur?'vcur':''}${v.state!=='DESTROYED'?' rowlink':''}"${v.state!=='DESTROYED'?` onclick="openReveal(${v.v})" title="클릭하여 키값 조회 — 사유 필수 · 감사로그 기록"`:''}>
      <td><span class="vtag ${isCur?'cur':''}">v${v.v}</span></td>
      <td>${stateBadge(v.state)}</td>
      <td class="mono">${fmt(v.activationDate)}${v.state==='PRE_ACTIVE'?' <span style="color:var(--blue)">예정</span>':v.state==='DESTROYED'?` <span style="color:var(--text-3)">· 폐기 ${fmt(v.destroyedAt)}</span>`:''}</td>
      <td class="mono">${fmt(v.lastUsedAt)}</td>
      <td class="mono">${v.usageCount.toLocaleString()}</td>
      <td class="mono" style="color:var(--text-2)">${capOf(v)}</td>
      <td>${v.state==='DESTROYED'?'<span style="color:var(--text-3)">—</span>':v.integrity?'<span class="badge b-ok">정상</span>':'<span class="badge b-bad">위반</span>'}</td>
      <td style="text-align:right" onclick="event.stopPropagation()">${act}</td></tr>`;}).join('');
  document.getElementById('kdAudit').innerHTML=USAGE.filter(u=>u.keyId===key.id).map(u=>
    `<tr><td class="mono">${u.at}</td><td class="mono">${u.operation}</td><td><span class="vtag">v${u.version}</span>${u.note?` <span class="help">${u.note}</span>`:''}</td><td>${u.result==='SUCCESS'?'<span class="badge b-ok">성공</span>':'<span class="badge b-bad">실패</span>'}</td><td class="mono" style="color:${u.failReason?'var(--red)':'var(--text-3)'};font-size:11.5px">${u.failReason||'—'}</td></tr>`
  ).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:28px">이 키에 대한 사용 기록이 없습니다</td></tr>';
  document.getElementById('kdTimeline').innerHTML=key.history.map((h,i)=>`
    <div class="tl-it"><span class="tl-dot" style="background:${h.trigger==='INTEGRITY'?'var(--red)':i===0?'var(--blue)':'var(--text-3)'}"></span>
      <div class="tl-body"><b><span class="vtag">v${h.v}</span> ${h.from?h.from+' → ':'생성 → '}${h.to}</b><span class="trg ${h.trigger==='INTEGRITY'?'bad':h.trigger.startsWith('DATE')||h.trigger==='SCHEDULE'?'sys':h.trigger==='REACTIVATE'?'ok':''}">${TRIGGER_KO[h.trigger]}</span>
      <div class="rs">사유: ${h.reason}</div><div class="at">${h.at} · ${h.by}</div></div></div>`).join('');
}
function showTab(t){
  document.getElementById('tabVer').classList.toggle('on',t==='ver');document.getElementById('tabAud').classList.toggle('on',t==='aud');
  document.getElementById('paneVer').style.display=t==='ver'?'':'none';document.getElementById('paneAud').style.display=t==='aud'?'':'none';
}
/* ---- 키값 조회 (사유 필수 · 감사로그 기록) ---- */
let revealTarget=null;
function openReveal(v){
  revealTarget=v;
  document.getElementById('mdRevealTitle').textContent=`키값 조회 (v${v})`;
  document.getElementById('rvReason').value='';
  document.getElementById('rvReasonWrap').style.display='';
  document.getElementById('rvResult').style.display='none';
  document.getElementById('rvBtn').style.display='';
  openModal('mdReveal');
}
function doReveal(){
  const r=document.getElementById('rvReason').value.trim();
  if(!r){toast('사유를 입력해주세요');return;}
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let s='';for(let i=0;i<43;i++)s+=c[Math.floor(Math.random()*64)];
  document.getElementById('rvLabel').textContent=`키 재료 (${key.algoName}-${key.size} · Base64)`;
  document.getElementById('rvValue').textContent=s+'=';
  document.getElementById('rvReasonWrap').style.display='none';
  document.getElementById('rvResult').style.display='';
  document.getElementById('rvBtn').style.display='none';
  toast('키 값이 조회되었습니다.');
}
/* ---- 모달 열기 ---- */
let desTarget=null,deactTarget=null;
function openActivate(){document.getElementById('actReason').value='';openModal('mdActivate');}
let reactTarget=null;
function openReactivate(ver){
  reactTarget=ver;
  document.getElementById('reactTitle').textContent=`재활성화 (REACTIVATE v${ver})`;
  document.getElementById('reactReason').value='';openModal('mdReactivate');
}
function openDeactivate(ver){
  deactTarget=ver;
  document.getElementById('deactTitle').textContent=ver?`버전 정지`:'키 정지';
  /* 최근 사용 정보 — 정지 전 마지막 사용·누적 횟수, 최근 7일 내 사용이면 붉게 강조 */
  const targets=ver?key.versions.filter(v=>v.v===ver):actives();
  const last=targets.map(v=>v.lastUsedAt).filter(Boolean).sort().pop()||null;
  const cnt=targets.reduce((s,v)=>s+v.usageCount,0);
  const recent=last&&(Date.now()-new Date(last.replace(' ','T')).getTime())<7*86400000;
  document.getElementById('deactInfo').innerHTML=`${ver?`v${ver}`:'ACTIVE 버전 전체'} — 마지막 사용 <b${recent?' style="color:var(--red)"':''}>${relTime(last)}</b>${last?` (${fmt(last)})`:''} · 누적 ${cnt.toLocaleString()}회`;
  document.getElementById('deactReason').value='';openModal('mdDeactivate');
}
function openRotate(){
  const full=key.versions.length>=MAX_VERSIONS;
  document.getElementById('rotBtn').disabled=full;document.getElementById('rotAct').value='';document.getElementById('rotReason').value='';openModal('mdRotate');
}
function openDestroy(ver){
  desTarget=ver||null;const av=actives();
  const cands=key.versions.filter(v=>v.state==='DEACTIVATED'||v.state==='PRE_ACTIVE');
  document.getElementById('desOpts').innerHTML=cands.map(v=>`<label class="opt ${desTarget===v.v?'sel':''}"><input type="radio" name="des" value="${v.v}" ${desTarget===v.v?'checked':''} onchange="selDes(this)"><span><b>v${v.v}만 삭제 <span class="badge ${BADGE[v.state]}" style="margin-left:4px">${STATE_KO[v.state]}</span></b><span>마지막 사용 ${fmt(v.lastUsedAt)} · 누적 ${v.usageCount.toLocaleString()}회</span></span></label>`).join('')
    +`<label class="opt ${av.length?'dis':''} ${!desTarget&&!av.length?'sel':''}"><input type="radio" name="des" value="ALL" ${av.length?'disabled':''} ${!desTarget&&!av.length?'checked':''} onchange="selDes(this)"><span><b>키 전체 삭제 (준비·정지 버전 ${cands.length}개)</b><span>${av.length?`ACTIVE 버전(${av.map(v=>'v'+v.v).join(', ')})이 있어 불가 (409) — 먼저 키 정지`:'모든 버전 삭제 후 키 상태가 DESTROYED가 됩니다'}</span></span></label>`;
  document.getElementById('desConfirm').value='';document.getElementById('desReason').value='';
  document.getElementById('desAck').checked=false;document.getElementById('desBtn').disabled=true;
  openModal('mdDestroy');
}
function selDes(i){document.querySelectorAll('#desOpts .opt').forEach(o=>o.classList.remove('sel'));i.closest('.opt').classList.add('sel');desTarget=i.value==='ALL'?null:Number(i.value);}
function openEdit(){
  document.getElementById('edName').value=key.name;document.getElementById('edDesc').value=key.desc||'';
  document.getElementById('edAutoRot').checked=!!key.autoRotate;document.getElementById('edRot').value=key.rotationPeriodDays||ROT_DEFAULT;document.getElementById('edRot').disabled=!key.autoRotate;
  const c=cur();
  document.getElementById('edDates').innerHTML=c.state==='PRE_ACTIVE'?`<div class="field"><label>활성일 (v${c.v})</label><input class="input mono" type="datetime-local" id="edAct" value="${(c.activationDate||'').slice(0,16).replace(' ','T')}"></div>`:'';
  openModal('mdEdit');
}
function saveEdit(){
  const on=document.getElementById('edAutoRot').checked,d=Number(document.getElementById('edRot').value);
  if(on&&!(d>=ROT_MIN&&d<=ROT_MAX)){toast('갱신 주기는 1~730일이어야 합니다');return;}
  key.name=document.getElementById('edName').value.trim()||key.name;key.desc=document.getElementById('edDesc').value;
  key.autoRotate=on;key.rotationPeriodDays=on?d:null;
  if(on){const n=new Date();n.setDate(n.getDate()+d);key.nextRotationAt=n.toISOString().slice(0,19).replace('T',' ');key.dday=d;}else{key.nextRotationAt=null;}
  closeModal('mdEdit');render();toast('키 정보가 수정되었습니다');
}
/* ---- 연산 실행 (목업: 로컬 데이터 갱신) ---- */
const now=()=>new Date().toISOString().slice(0,19).replace('T',' ');
function doAction(action){
  const reason=document.getElementById({ACTIVATE:'actReason',REACTIVATE:'reactReason',DEACTIVATE:'deactReason',ROTATE:'rotReason',DESTROY:'desReason'}[action]).value.trim();
  if(!reason){toast('사유를 입력해주세요');return;}
  const t=now(),H=key.history;
  if(action==='ACTIVATE'){const pv=preV();
    pv.state='ACTIVE';pv.activationDate=t;key.currentVersion=pv.v;
    H.unshift({v:pv.v,from:'PRE_ACTIVE',to:'ACTIVE',trigger:'OPERATION',reason,by:'류재민',at:t});closeModal('mdActivate');toast('활성화되었습니다.');}
  if(action==='REACTIVATE'){const v=key.versions.find(x=>x.v===reactTarget);
    v.state='ACTIVE';v.integrity=true;delete v.deactivationTrigger;key.integrity=key.versions.every(x=>x.integrity!==false);
    if(v.v>key.currentVersion||key.versions.every(x=>x.v===v.v||x.state!=='ACTIVE'))key.currentVersion=Math.max(key.currentVersion,v.v);
    H.unshift({v:v.v,from:'DEACTIVATED',to:'ACTIVE',trigger:'REACTIVATE',reason,by:'류재민',at:t});closeModal('mdReactivate');toast('재활성화되었습니다.');}
  if(action==='DEACTIVATE'){
    const targets=deactTarget?key.versions.filter(v=>v.v===deactTarget):actives();
    targets.forEach(v=>{v.state='DEACTIVATED';v.deactivationTrigger='OPERATION';H.unshift({v:v.v,from:'ACTIVE',to:'DEACTIVATED',trigger:'OPERATION',reason:(deactTarget?'':'[키 정지] ')+reason,by:'류재민',at:t});});
    if(!deactTarget){key.autoRotate=false;key.nextRotationAt=null;}
    closeModal('mdDeactivate');toast('정지되었습니다.');}
  if(action==='ROTATE'){const d=document.getElementById('rotAct').value,future=d&&new Date(d)>new Date(),pv=preV();
    if(pv){pv.state='DESTROYED';pv.destroyedAt=t;H.unshift({v:pv.v,from:'PRE_ACTIVE',to:'DESTROYED',trigger:'ROTATE',reason:'새 갱신으로 예약 취소',by:'류재민',at:t});}
    const nv={v:key.versions.length+1,state:future?'PRE_ACTIVE':'ACTIVE',activationDate:future?d.replace('T',' ')+':00':t,integrity:true,lastUsedAt:null,usageCount:0};
    key.versions.unshift(nv);
    if(!future)key.currentVersion=nv.v;
    H.unshift({v:nv.v,from:null,to:nv.state,trigger:'ROTATE',reason,by:'류재민',at:t});closeModal('mdRotate');
    toast('갱신되었습니다.');}
  if(action==='DESTROY'){
    if(!document.getElementById('desAck').checked){toast('복구 불가 확인에 체크해주세요');return;}
    if(document.getElementById('desConfirm').value.trim()!==key.name){toast('키명이 일치하지 않습니다');return;}
    if(!desTarget&&actives().length){toast('운영 중인 버전이 있어 삭제할 수 없습니다');return;}
    const targets=desTarget?key.versions.filter(v=>v.v===desTarget):key.versions.filter(v=>v.state==='DEACTIVATED'||v.state==='PRE_ACTIVE');
    targets.forEach(v=>{H.unshift({v:v.v,from:v.state,to:'DESTROYED',trigger:'OPERATION',reason,by:'류재민',at:t});v.state='DESTROYED';v.destroyedAt=t;});
    closeModal('mdDestroy');toast('삭제되었습니다.');}
  render();
  clampTimeline();
}
/* 타임라인 카드가 메타 카드보다 길면 잘라서 페이드 + 더보기 노출 (1열 레이아웃 제외) */
function clampTimeline(){
  const meta=document.getElementById('kdMetaCard'),card=document.getElementById('kdTlCard'),more=document.getElementById('tlMore');
  card.style.maxHeight='';more.style.display='none';
  if(window.innerWidth<=1100)return;
  const h=meta.offsetHeight;
  if(card.scrollHeight>h+1){card.style.maxHeight=h+'px';more.style.display='flex';}
}
function openTimeline(){
  document.getElementById('mdTlBody').innerHTML=document.getElementById('kdTimeline').innerHTML;
  openModal('mdTimeline');
}
window.addEventListener('resize',clampTimeline);
render();
clampTimeline();
/* 상대시간("방금 전"→"1분 전")은 시간이 흐르면 달라지므로 30초마다 재계산 */
setInterval(()=>{const el=document.getElementById('kdLastUse');if(el)el.textContent=relTime(el.title||null);},30000);
</script>
</body>
</html>
